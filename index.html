<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>CLACK</title>
<style>
/* ============================== STYLES ============================== */
:root{
  --bg:#120a06; --panel:#2a170d; --panel2:#3b2214; --panel3:#4a2c1a; --line:rgba(244,213,138,.38);
  --ink:#fff4dc; --muted:#d8c6a2; --accent:#f2c45a; --accent-ink:#2a1500;
  --blue:#4cc9f0; --good:#8be28b; --bad:#ff6b7f; --gold:#ffd166; --shard:#9be7ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100vh;height:100dvh}
canvas#game{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* in-game floating buttons */
.iconbtn{position:absolute;pointer-events:auto;width:52px;height:52px;border-radius:16px;border:1px solid rgba(244,213,138,.5);color:#f6cd63;
  background:linear-gradient(180deg,rgba(70,40,22,.92),rgba(30,16,8,.92));font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;
  top:calc(var(--sat) + 8px)}
.iconbtn:active{transform:scale(.94)}
#bankBtn,#ffBtn{font-family:Georgia,'Times New Roman',serif;letter-spacing:.04em;position:absolute;pointer-events:auto;left:50%;transform:translateX(-50%);min-height:60px;min-width:240px;max-width:calc(100% - 32px);
  border:1px solid #fff0b8;border-radius:18px;background:linear-gradient(180deg,#fff2bf 0%,#f2c45a 42%,#c8902e 70%,#9a6418 100%);color:#2a1500;font-size:21px;font-weight:700;padding:10px 22px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 5px 0 #6b4210,0 8px 22px rgba(0,0,0,.45)}
#bankBtn:active,#ffBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #a8700c}
#bankBtn,#ffBtn{white-space:nowrap}
#ffBtn{background:linear-gradient(180deg,#5fd39a,#1f7a4c);border-color:#a8f0c8;color:#062414;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 5px 0 #0f3d26,0 8px 22px rgba(0,0,0,.45)}
#ffBtn.on{background:#ffffff;color:#05232e}

/* screens */
#screen{position:absolute;inset:0;pointer-events:auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  background:radial-gradient(120% 80% at 50% 30%,rgba(46,26,14,.93),rgba(12,6,3,.96))}
#screen.see{background:linear-gradient(180deg,rgba(14,7,3,.6) 0%,rgba(14,7,3,.18) 30%,rgba(14,7,3,.4) 55%,rgba(14,7,3,.95) 78%)}
#screen.fadein{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.col{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;flex:1 0 auto}
.spacer{flex:1 1 auto;min-height:8px}
.foot{position:sticky;bottom:0;margin:0 -16px calc(-1 * var(--sab) - 16px);padding:14px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,rgba(7,19,14,0) 0%,rgb(7,19,14) 24%);z-index:2}
.li.c{min-height:44px;padding:6px 12px}
.row{display:flex;gap:12px;width:100%}
.row>*{flex:1 1 0}
.btn{appearance:none;border:1px solid var(--line);border-radius:16px;min-height:56px;padding:12px 16px;font-size:19px;font-weight:800;line-height:1.15;
  background:linear-gradient(180deg,#4a2b18,#2a160b);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,225,180,.18),0 4px 0 rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.primary{background:linear-gradient(180deg,#fff2bf 0%,#f2c45a 42%,#c8902e 70%,#9a6418 100%);border:1px solid #fff0b8;color:#2a1500;font-family:Georgia,'Times New Roman',serif;font-size:25px;font-weight:700;letter-spacing:.06em;min-height:74px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 5px 0 #6b4210,0 10px 24px rgba(255,190,90,.25)}
.btn.primary:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 1px 0 #6b4210}
.btn.blue{background:linear-gradient(180deg,#5fd39a,#1f7a4c);border-color:#a8f0c8;color:#062414;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #0f3d26}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.small{min-height:48px;font-size:17px;padding:8px 12px}
.btn .sub{display:block;font-size:16px;font-weight:700;opacity:.8}
.btn.stack{flex-direction:column;gap:2px}
h1.logo{font-family:Georgia,'Times New Roman',serif;font-size:min(22vw,104px);font-weight:700;letter-spacing:.04em;line-height:.95;text-align:center;margin-top:4vh;
  background:linear-gradient(180deg,#fff8dc 0%,#f6cd63 45%,#c58a2e 62%,#ffe7a0 78%,#a8701e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
.tag{align-self:center;text-align:center;color:#fff7e6;font-size:18px;font-weight:800;letter-spacing:.02em;background:rgba(4,10,8,.72);border:1px solid rgba(255,214,140,.25);border-radius:999px;padding:6px 16px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
h2{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;text-align:center;letter-spacing:.02em;background:linear-gradient(180deg,#fff6d2,#f2c45a 55%,#b47a26);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
h3{font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:700;color:#e6c47a;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
p,.txt{font-size:17px;line-height:1.35}
.muted{color:var(--muted)}
.center{text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border-radius:999px;background:linear-gradient(180deg,#3d2415,#24130a);border:1px solid var(--line);color:var(--ink);padding:8px 14px;font-size:16px;font-weight:800;min-height:48px;display:flex;align-items:center;gap:6px}
.coin{color:var(--gold)} .shard{color:var(--shard)}
.panel{background:linear-gradient(180deg,#36200f,#22120a);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,225,180,.12)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#341e10,#22130a);border:1px solid rgba(244,213,138,.16);border-radius:14px;padding:10px 12px;min-height:56px;font-size:17px}
.li .grow{flex:1;min-width:0}
.li .nm{font-weight:900;font-size:18px}
.li .ds{color:var(--muted);font-size:16px;line-height:1.25}
.li.done{opacity:.6}
.big{font-size:56px;font-weight:900;letter-spacing:-.03em;text-align:center;line-height:1}
.delta{text-align:center;font-size:19px;font-weight:900}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}

/* upgrade cards */
.card{appearance:none;border:2px solid rgba(244,213,138,.45);background:linear-gradient(180deg,#46291a,#26140b);border-radius:20px;
  min-height:104px;padding:12px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.card .ctext{flex:1;min-width:0}
.card .ctag{font-size:14px;font-weight:900;letter-spacing:.1em;color:var(--accent)}
.card .cname{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;line-height:1.1;color:#fff4dc}
.card .cdesc{font-size:16px;color:var(--muted);line-height:1.25;margin-top:2px}
.card.charm{border-color:#b388ff} .card.charm .ctag{color:#c9a7ff}
.card[disabled]{opacity:.4;pointer-events:none}
.card.r{border-color:#4cc9f0}.card.r .ctag{color:#7fdcff}
.card.l{border-color:#ffd166;animation:legend 1.6s ease-in-out infinite}.card.l .ctag{color:#ffd166}
@keyframes legend{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 6px rgba(255,209,102,.3)}50%{box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 26px rgba(255,209,102,.85)}}
.rm .card.l{animation:none}
.card.path{min-height:88px}
.shopitem.r .snm{color:#7fdcff}.shopitem.l .snm{color:#ffd166}
.badge{width:64px;height:64px;flex:0 0 64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;
  background:#2a1f4a;border:2px solid #b388ff;color:#e6d9ff}
.badge.sm{width:44px;height:44px;flex-basis:44px;font-size:22px;border-radius:12px}
.mprev{width:64px;height:64px;flex:0 0 64px}
.mprev.sm{width:44px;height:44px;flex-basis:44px}

/* bag grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%}
.tile{appearance:none;border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:8px 4px;min-height:120px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;font-weight:800}
.tile .lv{font-size:14px;color:var(--gold)}
.tile[disabled]{opacity:.32;pointer-events:none}
.tile.view{pointer-events:none}

/* shop items */
.shopitem{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#341e10,#22130a);border:1px solid rgba(244,213,138,.16);border-radius:14px;padding:8px 10px;min-height:64px}
.col.tight{gap:8px}
.snm{font-weight:900;font-size:17px;line-height:1.15}
.sds{font-size:16px;color:var(--muted);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shopitem .grow{flex:1;min-width:0}
.shopitem .btn{min-width:80px;flex:0 0 auto}
.shopitem.sold{opacity:.4}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tabs .btn{flex:1 1 28%;min-height:52px;font-size:17px}
.tabs .btn.on{background:linear-gradient(180deg,#f6d77a,#c8902e);color:#2a1500}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-radius:14px;padding:8px 8px 8px 14px;min-height:64px}
.set .lbl{font-size:18px;font-weight:800}
.set .lbl small{display:block;font-size:16px;font-weight:600;color:var(--muted)}
.tog{min-width:96px;min-height:52px;border-radius:999px;border:0;font-size:17px;font-weight:900;background:#3b4a44;color:#cfd8d3}
.tog.on{background:linear-gradient(180deg,#f6d77a,#c8902e);color:#2a1500}
.seg{display:flex;gap:6px}
.seg button{min-width:64px;min-height:52px;border-radius:12px;border:0;background:#2f3d38;color:#d8e2dd;font-size:16px;font-weight:900}
.seg button.on{background:linear-gradient(180deg,#f6d77a,#c8902e);color:#2a1500}

/* initials picker */
.ini{display:flex;gap:14px;justify-content:center;align-items:center}
.ini .slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.ini .slot button{width:56px;height:52px;border-radius:12px;border:0;background:var(--panel2);font-size:20px;font-weight:900}
.ini .slot .ch{font-size:40px;font-weight:900;width:56px;text-align:center;line-height:1.1}

/* overlays */
#modal{position:absolute;inset:0;pointer-events:auto;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
#modal .box{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
#modal textarea{width:100%;min-height:110px;border-radius:12px;padding:10px;font-size:16px;background:#0a1a14;color:var(--ink);border:2px solid var(--line);user-select:text;-webkit-user-select:text;touch-action:auto}
#countdown{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,12,9,.55);z-index:4}
#countdown .n{font-family:Georgia,'Times New Roman',serif;font-size:120px;font-weight:700;color:#f6cd63;text-shadow:0 6px 0 rgba(0,0,0,.5)}
#countdown .t{font-size:24px;font-weight:900;color:var(--accent)}
#rotate{position:absolute;inset:0;pointer-events:auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;font-size:22px;font-weight:900}
#rotate .ph{width:60px;height:100px;border:5px solid var(--ink);border-radius:14px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
#toasts{position:absolute;left:0;right:0;top:calc(var(--sat) + 120px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:6;pointer-events:none}
.toast{background:linear-gradient(180deg,rgba(54,32,16,.97),rgba(30,16,8,.97));border:1px solid var(--accent);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:17px;font-weight:800;
  max-width:90vw;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:toast 2.8s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#screen.fadein,.toast{animation:none}}
.rm .toast{animation:none}

<body>
<canvas id="game" tabindex="-1" aria-label="CLACK game board"></canvas>
<div id="ui">
  <button id="pauseBtn" class="iconbtn hidden" aria-label="Pause">&#10074;&#10074;</button>
  <button id="ffBtn" class="hidden" aria-label="Fast forward">⏩ FAST FORWARD 3×</button>
  <button id="bankBtn" class="hidden" aria-label="Cash out">CASH OUT &#9654;</button>
  <div id="toasts" aria-live="polite"></div>
  <div id="screen" class="hidden"></div>
  <div id="countdown" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="rotate" class="hidden"><div class="ph"></div><div>Turn your phone upright</div></div>
</div>

<script>
'use strict';
/* =====================================================================
   CLACK: one-thumb marble chaos roguelite
   ---------------------------------------------------------------------
   1. TUNING CONSTANTS
   2. PLATFORM LAYER (storage, haptics, share, wake lock): swap for native plugins
   3. SEEDED RNG
   4. CONTENT DATA (materials, engravings, charms, unlocks, challenges, achievements)
   5. SAVE SYSTEM (versioned key + migration)
   6. AUDIO ENGINE (procedural SFX + adaptive layered music)
   7. SIMULATION (deterministic Run: physics, scoring, rooms, rewards, shop). No DOM, audio or Math.random.
   8. FX + RENDERING (canvas)
   9. UI SCREENS (DOM)
   10. INPUT (pointer, keyboard, gamepad)
   11. APP / MAIN LOOP

    get(key) {
      try { if (lsOk) { const v = localStorage.getItem(key); if (v != null) return JSON.parse(v); } } catch (e) {}
      try { return key in mem ? JSON.parse(mem[key]) : null; } catch (e) { return null; }
    },
    set(key, val) {
      let s; try { s = JSON.stringify(val); } catch (e) { return; }
      mem[key] = s;
      try { if (lsOk) localStorage.setItem(key, s); } catch (e) {}
    },
    remove(key) { delete mem[key]; try { if (lsOk) localStorage.removeItem(key); } catch (e) {} },
    get persistent() { return lsOk; },
  };

  const haptics = {
    set(on) { hapticsOn = !!on; },
    play(pattern) {
      if (!hapticsOn) return;
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      const now = performance.now(); if (now - lastVib < 45) return; lastVib = now;
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
    },
  };

    try { if (navigator.share) { await navigator.share({ title: 'CLACK', text }); return 'shared'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }

  }

    async request() {
      try {
        if ('wakeLock' in navigator && !lock && document.visibilityState === 'visible') {

          lock.addEventListener('release', () => { lock = null; });
        }
      } catch (e) { lock = null; }
    },
    release() { try { if (lock) lock.release(); } catch (e) {} lock = null; },
  };

    int(lo, hi) { return lo + Math.floor(r.next() * (hi - lo + 1)); },

    chance(p) { return r.next() < p; },

  const quality = Perf.q, add = quality >= 1, warm = rgba(theme.neon, 1), cool = rgba(theme.cyan, 1);
  const shadow = shadowSprite();
  // gates: two brass posts with a beam of golden light between them
  for (const gt of run.gates) {
    g.save(); g.translate(gt.x, gt.y); g.rotate(gt.a || 0);
    const hot = gt.mult === 3, beam = g.createLinearGradient(0, -6, 0, 6);
    beam.addColorStop(0, 'rgba(0,0,0,0)'); beam.addColorStop(0.5, hot ? rgba(theme.pink, 0.6) : rgba(theme.cyan, 0.55)); beam.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = beam; g.fillRect(-gt.w / 2, -6, gt.w, 12);
    const sx = ((t * 0.9) % 1) * gt.w - gt.w / 2; g.fillStyle = 'rgba(255,250,220,.7)'; g.fillRect(sx - 3, -1, 6, 2);
    g.restore();
    const ex = Math.cos(gt.a || 0) * gt.w / 2, ey = Math.sin(gt.a || 0) * gt.w / 2;
    for (const sgn of [-1, 1]) { g.drawImage(shadow, gt.x + sgn * ex - 5, gt.y + sgn * ey - 3, 12, 11); brassStud(g, gt.x + sgn * ex, gt.y + sgn * ey, 4.6); }
    const lx = -(gt.s || 0) * 14, ly = -(gt.c === undefined ? 1 : gt.c) * 14, px = gt.x + (ly > 0 ? -lx : lx), py = gt.y - Math.abs(ly);
    g.fillStyle = 'rgba(10,8,26,.88)'; rrect(g, px - 12, py - 7, 24, 14, 7); g.fill(); g.strokeStyle = hot ? theme.pink : theme.cyan; g.lineWidth = 1.2; rrect(g, px - 12, py - 7, 24, 14, 7); g.stroke();
    g.font = font(900, 10.5); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = hot ? theme.pink : theme.cyan; g.fillText('\u00D7' + (gt.mult || 2), px, py + 0.5);
  }
  // vortexes: an ink whirlpool with gilded currents
  for (const v of run.vortexes) {
    g.save(); g.translate(v.x, v.y);
    const grd = g.createRadialGradient(0, 0, 3, 0, 0, v.r); grd.addColorStop(0, 'rgba(4,2,10,.92)'); grd.addColorStop(0.55, 'rgba(30,14,50,.45)'); grd.addColorStop(1, 'rgba(30,14,50,0)');
    g.fillStyle = grd; circle(g, 0, 0, v.r);
    g.rotate(t * 2.2); g.lineWidth = 1.8;
    for (let i = 0; i < 4; i++) { g.rotate(TAU / 4); g.strokeStyle = i % 2 ? 'rgba(244,213,138,.6)' : 'rgba(210,160,255,.45)'; g.beginPath(); for (let k = 0; k <= 15; k++) { const a = k * 0.3, rr = 6 + k * 3.5; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.stroke(); }
    g.restore();
  }
  // boost pads: brass-framed leather plaques with engraved chevrons
  for (const pd of run.pads) {
    g.save(); g.translate(pd.x, pd.y); g.rotate(pd.a);
    g.fillStyle = 'rgba(0,0,0,.35)'; rrect(g, -pd.w / 2 + 1.5, -pd.h / 2 + 2.5, pd.w, pd.h, 6); g.fill();
    const lg = g.createLinearGradient(0, -pd.h / 2, 0, pd.h / 2); lg.addColorStop(0, '#221c45'); lg.addColorStop(1, '#0f0c24');
    g.fillStyle = lg; rrect(g, -pd.w / 2, -pd.h / 2, pd.w, pd.h, 6); g.fill();
    g.strokeStyle = rgba(theme.cyan, 0.7); g.lineWidth = 1.4; rrect(g, -pd.w / 2, -pd.h / 2, pd.w, pd.h, 6); g.stroke();
    for (let i = 0; i < 3; i++) {
      const x = -pd.w / 2 + 12 + i * 11, ph = (t * 2.2 - i * 0.33) % 1, glow = Math.max(0, Math.sin(ph * Math.PI));
      g.strokeStyle = rgba(glow > 0.5 ? mixHex(theme.cyan, '#ffffff', 0.5) : theme.cyan, (0.4 + 0.6 * glow).toFixed(2)); g.lineWidth = 2.6; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x - 4, -6.5); g.lineTo(x + 3, 0); g.lineTo(x - 4, 6.5); g.stroke();
    }
    g.lineCap = 'butt'; g.restore();
  }
  // collectible gold stars
  for (const st of run.stars) {
    if (st.got) continue;
    if (add) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.35 + 0.15 * Math.sin(t * 4 + st.x); g.drawImage(glowSprite(warm), st.x - 20, st.y - 20, 40, 40); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    g.save(); g.translate(st.x, st.y); g.rotate(Math.sin(t * 1.3 + st.y) * 0.25);
    g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 4.4 : 10.5; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath();
    g.fillStyle = neonGrad(g, -10, 10); g.fill(); g.strokeStyle = rgba(theme.frame2, 0.9); g.lineWidth = 1.1; g.stroke();
    const tw = (t * 1.7 + st.x * 0.01) % 2; if (tw < 0.4) { const k = Math.sin(tw / 0.4 * Math.PI); g.fillStyle = 'rgba(255,255,255,' + (0.9 * k).toFixed(2) + ')'; g.beginPath(); g.moveTo(-3, -5); g.lineTo(-2, -2); g.lineTo(1, -1); g.lineTo(-2, 0); g.lineTo(-3, 3); g.lineTo(-4, 0); g.lineTo(-7, -1); g.lineTo(-4, -2); g.closePath(); g.fill(); }
    g.restore();
  }
  // multiball: a crystal orb with three marbles inside
  for (const mb of run.multis) {
    if (mb.got) continue;
    const pulse = 1 + 0.06 * Math.sin(t * 6), r = mb.r * pulse;
    g.drawImage(shadow, mb.x - r + 2, mb.y - r * 0.8 + 4, r * 2.2, r * 1.9);
    const cg = g.createRadialGradient(mb.x - r * 0.3, mb.y - r * 0.35, 1, mb.x, mb.y, r); cg.addColorStop(0, 'rgba(255,255,255,.95)'); cg.addColorStop(0.6, 'rgba(190,225,245,.55)'); cg.addColorStop(1, 'rgba(90,140,170,.8)');
    g.fillStyle = cg; circle(g, mb.x, mb.y, r);
    for (const [ox, oy, c] of [[0, -4, '#e8c08a'], [-4, 3, '#b8d8e8'], [4, 3, '#f0a0b0']]) { g.fillStyle = c; circle(g, mb.x + ox, mb.y + oy, 2.6); }
    g.strokeStyle = theme.cyan; g.lineWidth = 1.8; g.beginPath(); g.arc(mb.x, mb.y, r, 0, TAU); g.stroke();
  }
  // holes: deep pockets with polished brass rims
  for (const h of run.holes) {
    const pg = g.createRadialGradient(h.x, h.y - h.r * 0.35, 0, h.x, h.y, h.r);
    pg.addColorStop(0, '#000'); pg.addColorStop(0.7, '#03020a'); pg.addColorStop(1, '#221c45');
    g.fillStyle = pg; circle(g, h.x, h.y, h.r);
    g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 2; g.beginPath(); g.arc(h.x, h.y, h.r - 1, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    g.strokeStyle = '#3a3266'; g.lineWidth = 3.6; g.beginPath(); g.arc(h.x, h.y, h.r + 1.6, 0, TAU); g.stroke(); g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1; g.beginPath(); g.arc(h.x, h.y, h.r + 2.6, Math.PI * 1.1, Math.PI * 1.7); g.stroke();
    g.strokeStyle = h.pit ? 'rgba(255,80,100,' + (0.5 + 0.4 * Math.sin(t * 8)).toFixed(2) + ')' : 'rgba(255,90,90,.35)'; g.lineWidth = 1.4; g.setLineDash([3, 5]); g.lineDashOffset = -t * (h.pit ? 30 : 8);
    g.beginPath(); g.arc(h.x, h.y, h.r + 5.5, 0, TAU); g.stroke(); g.setLineDash([]);
  }
  // spikes: silver caltrops with a garnet heart and a warning glow
  for (const sp of run.spikes) {
    if (add) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.25 + 0.12 * Math.sin(t * 5); g.drawImage(glowSprite('rgba(255,60,60,1)'), sp.x - 30, sp.y - 30, 60, 60); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    g.drawImage(shadow, sp.x - sp.r + 2, sp.y - sp.r * 0.8 + 4, sp.r * 2.3, sp.r * 2);
    g.save(); g.translate(sp.x, sp.y); g.rotate(t * 0.5);
    g.beginPath(); for (let i = 0; i < 16; i++) { const a = i * TAU / 16, r = i % 2 ? sp.r * 0.5 : sp.r + 2; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath();
    const sg = g.createLinearGradient(-sp.r, -sp.r, sp.r, sp.r); sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.45, '#c9ced6'); sg.addColorStop(1, '#4b5059');
    g.fillStyle = sg; g.fill(); g.strokeStyle = 'rgba(20,20,25,.85)'; g.lineWidth = 1.2; g.stroke();
    const jg = g.createRadialGradient(-1, -1, 0, 0, 0, sp.r * 0.38); jg.addColorStop(0, '#ffd0d0'); jg.addColorStop(0.5, '#c0102e'); jg.addColorStop(1, '#3a0410');
    g.fillStyle = jg; circle(g, 0, 0, sp.r * 0.36);
    g.restore();
  }
  // blocks: ivory lacquer tiles with gold trim and inlaid gold pips (health)
  for (const k of run.blocks) {
    if (k.dead) continue;
    const x = -k.w / 2, y = -k.h / 2;
    g.save(); g.translate(k.x + 2.5, k.y + 4); g.rotate(k.a || 0); g.fillStyle = 'rgba(0,0,0,.35)'; rrect(g, x, y, k.w, k.h, 5); g.fill(); g.restore();
    g.save(); g.translate(k.x, k.y); g.rotate(k.a || 0);
    if (k.spin) {
      const bg = g.createLinearGradient(0, y, 0, y + k.h); bg.addColorStop(0, '#fff3cc'); bg.addColorStop(0.4, theme.brass); bg.addColorStop(1, theme.brass3);
      g.fillStyle = bg; rrect(g, x, y, k.w, k.h, 6); g.fill();
      g.fillStyle = '#a3162f'; g.fillRect(x + 8, -1.5, k.w - 16, 3);
      g.strokeStyle = 'rgba(40,20,0,.7)'; g.lineWidth = 1; rrect(g, x, y, k.w, k.h, 6); g.stroke();
      brassStud(g, x + 6, 0, 3.2); brassStud(g, -x - 6, 0, 3.2); brassStud(g, 0, 0, 7);
    } else {
      const rad = Math.min(k.h / 2, 7), bg = g.createLinearGradient(0, y, 0, y + k.h); bg.addColorStop(0, mixHex(theme.cyan, '#ffffff', 0.45)); bg.addColorStop(0.5, theme.cyan); bg.addColorStop(1, theme.cyan2);
      g.fillStyle = bg; rrect(g, x, y, k.w, k.h, rad); g.fill();
      g.fillStyle = 'rgba(255,255,255,.35)'; rrect(g, x + 3, y + 1.5, k.w - 6, 2.5, 1.2); g.fill();
      g.strokeStyle = 'rgba(5,20,30,.5)'; g.lineWidth = 0.9; rrect(g, x, y, k.w, k.h, rad); g.stroke();
      if (k.hp < k.maxHp) { g.strokeStyle = 'rgba(60,30,10,.6)'; g.lineWidth = 1.1; g.beginPath(); g.moveTo(x + k.w * 0.3, y); g.lineTo(x + k.w * 0.42, y + k.h * 0.5); g.lineTo(x + k.w * 0.34, y + k.h); if (k.hp < k.maxHp / 2) { g.moveTo(x + k.w * 0.72, y + k.h); g.lineTo(x + k.w * 0.6, y + k.h * 0.4); g.lineTo(x + k.w * 0.66, y); } g.stroke(); }
      const n = Math.max(0, Math.min(8, Math.ceil(k.hp))), pw = Math.min(6, (k.w - 10) / Math.max(1, n));
      g.fillStyle = '#0d1a2e'; for (let i = 0; i < n; i++) circle(g, -(n - 1) * pw / 2 + i * pw, 0.5, 2);
    }
    if (k.flash > 0) { g.globalAlpha = k.flash; g.fillStyle = '#ffffff'; rrect(g, x, y, k.w, k.h, 5); g.fill(); g.globalAlpha = 1; k.flash = Math.max(0, k.flash - dtF * 6); }
    g.restore();
  }
  // bumpers: polished brass; lit ones glow warm, Frenzy cycles the jewels through colours
  for (const bp of run.bumpers) {
    const f = bp.flash || 0, sc = 1 + f * 0.12, r = bp.r * sc, kind = bp.warden ? 'w' : bp.seed ? 's' : 'n';
    g.drawImage(shadow, bp.x - r * 1.05 + 3, bp.y - r * 0.9 + 5, r * 2.3, r * 2.1);
    const lit = bp.lit || run.frenzy > 0, gc = run.frenzy > 0 ? GLOW_HUES[Math.floor(t * 6 + bp.x * 0.05) % GLOW_HUES.length] : warm;
    if (add) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = lit ? 0.5 + 0.15 * Math.sin(t * 5 + bp.y) : 0.16; g.drawImage(glowSprite(gc), bp.x - r * 2.2, bp.y - r * 2.2, r * 4.4, r * 4.4); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    const spr = bumperSprite(bp.r, kind), sz = (bp.r + 2) * 2 * sc;
    g.drawImage(spr, bp.x - sz / 2, bp.y - sz / 2, sz, sz);
    if (lit) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.8; g.drawImage(glowSprite(gc), bp.x - r * 0.5, bp.y - r * 0.5, r, r); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    if (bp.warden) {
      g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.arc(bp.x, bp.y, r + 8, 0, TAU); g.stroke();
      g.strokeStyle = brassLine(g, bp.x - r, bp.y - r, bp.x + r, bp.y + r); g.beginPath(); g.arc(bp.x, bp.y, r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0, bp.hp) / bp.maxHp); g.stroke();
    }
    if (f > 0) {
      if (add) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = f * 0.9; g.drawImage(glowSprite(warm), bp.x - r * 2.6, bp.y - r * 2.6, r * 5.2, r * 5.2); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
      g.strokeStyle = 'rgba(255,240,200,' + f.toFixed(2) + ')'; g.lineWidth = 2; g.beginPath(); g.arc(bp.x, bp.y, r + 2 + (1 - f) * 10, 0, TAU); g.stroke();
      bp.flash = Math.max(0, f - dtF * 5);
    }
  }
  // boss attack warning
  if (run.boss && run.boss.warn > 0) {
    const p = run.bossPos(), k = 1 - run.boss.warn / 1.2, pulse = 0.5 + 0.5 * Math.sin(t * 22);
    if (run.boss.kind === 'crusher') { g.strokeStyle = 'rgba(255,77,109,' + (0.4 + 0.5 * pulse).toFixed(2) + ')'; g.lineWidth = 6; const ins = (run.inset || 0) + 12; g.strokeRect(ins, ins, T.W - ins * 2, T.H - ins * 2); }
    else { g.strokeStyle = 'rgba(255,77,109,' + (0.5 + 0.5 * pulse).toFixed(2) + ')'; g.lineWidth = 4; g.beginPath(); g.arc(p.x, p.y, 20 + k * (run.boss.kind === 'warden' ? 150 : 40), 0, TAU); g.stroke(); }
  }
  // closing walls: dark mahogany sliding in
  if (run.inset > 0) {
    const ins = run.inset, wg = g.createLinearGradient(0, 0, 0, T.H); wg.addColorStop(0, theme.wood); wg.addColorStop(1, theme.wood2);
    g.fillStyle = wg; g.fillRect(0, 0, T.W, ins); g.fillRect(0, T.H - ins, T.W, ins); g.fillRect(0, ins, ins, T.H - ins * 2); g.fillRect(T.W - ins, ins, ins, T.H - ins * 2);
    g.strokeStyle = brassLine(g, 0, 0, T.W, T.H); g.lineWidth = 2.5; g.strokeRect(ins, ins, T.W - ins * 2, T.H - ins * 2);
    g.strokeStyle = 'rgba(255,77,109,.6)'; g.lineWidth = 1.5; g.strokeRect(ins + 3, ins + 3, T.W - ins * 2 - 6, T.H - ins * 2 - 6);
  }
  // golden orb
  if (run.orb) {
    const o = run.orb, pulse = 1 + Math.sin(t * 8) * 0.08, blink = o.life < 2 && Math.sin(t * 20) < 0;
    if (add) { g.globalCompositeOperation = 'lighter'; g.drawImage(glowSprite('rgba(255,210,100,.9)'), o.x - 46, o.y - 46, 92, 92); g.globalCompositeOperation = 'source-over'; }
    g.save(); g.translate(o.x, o.y); g.rotate(t * 1.2); g.strokeStyle = 'rgba(255,230,160,.65)'; g.lineWidth = 1.6;
    for (let i = 0; i < 8; i++) { g.rotate(Math.PI / 4); g.beginPath(); g.moveTo(o.r + 4, 0); g.lineTo(o.r + (i % 2 ? 9 : 14), 0); g.stroke(); }
    g.restore();
    if (!blink) { const grd = g.createRadialGradient(o.x - 4, o.y - 5, 1, o.x, o.y, o.r * pulse); grd.addColorStop(0, '#fffbe0'); grd.addColorStop(0.45, '#f6cd63'); grd.addColorStop(1, '#8a5718'); g.fillStyle = grd; circle(g, o.x, o.y, o.r * pulse); }
    g.strokeStyle = '#fff3c4'; g.lineWidth = 2; g.beginPath(); g.arc(o.x, o.y, o.r + 3, -Math.PI / 2, -Math.PI / 2 + TAU * o.life / T.ORB_LIFE); g.stroke();
  }
  // juggernaut: a blackened iron ball with a brass band
  if (run.jugg) {
    const j = run.jugg, x = j.px + (j.x - j.px) * alpha, y = j.py + (j.y - j.py) * alpha;
    g.drawImage(shadow, x - j.r * 1.1 + 4, y - j.r * 0.9 + 6, j.r * 2.4, j.r * 2.1);
    const grd = g.createRadialGradient(x - 6, y - 7, 2, x, y, j.r); grd.addColorStop(0, '#8a8f99'); grd.addColorStop(0.5, '#33363d'); grd.addColorStop(1, '#0c0d10');
    g.fillStyle = grd; circle(g, x, y, j.r);
    g.save(); g.translate(x, y); g.rotate(j.spin); g.fillStyle = theme.brass2; g.fillRect(-j.r, -3, j.r * 2, 6); g.fillStyle = '#a3162f'; g.fillRect(-j.r, -1, j.r * 2, 2); g.restore();
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(x - j.r * 0.38, y - j.r * 0.45, j.r * 0.2, j.r * 0.1, -0.6, 0, TAU); g.fill();
  }
  // ghost (best run) marbles in the same room
  if (App.ghost && App.ghostVisible && App.state === 'play') {
    const gr = App.ghost.run;
    if (gr.roomIdx === run.roomIdx && gr.phase === 'play') {
      g.setLineDash([3, 3]); g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,240,210,.55)'; g.fillStyle = 'rgba(255,240,210,.12)';
      for (const b of gr.marbles) { if (!b.alive) continue; const x = b.px + (b.x - b.px) * alpha, y = b.py + (b.y - b.py) * alpha; g.beginPath(); g.arc(x, y, b.r, 0, TAU); g.fill(); g.stroke(); }
      g.setLineDash([]);
    }
  }
  // marbles
  const pxk = L.s * L.dpr;
  for (const b of run.marbles) {
    if (!b.alive) continue;
    const x = b.px + (b.x - b.px) * alpha, y = b.py + (b.y - b.py) * alpha;
    const sp2 = b.vx * b.vx + b.vy * b.vy;
    g.drawImage(shadow, x - b.r * 1.05 + 2.5, y - b.r * 0.85 + 4.5, b.r * 2.35, b.r * 2.05);
    if (add && sp2 > 330 * 330) {   // motion streak, tinted by the marble's colour
      const m = MATS[b.mat] || MATS.clay, len = Math.min(0.05, 22 / Math.sqrt(sp2));
      const tg = g.createLinearGradient(x, y, x - b.vx * len, y - b.vy * len); tg.addColorStop(0, rgba(theme.neon, 0.55)); tg.addColorStop(1, rgba(theme.neon, 0));
      g.strokeStyle = tg; g.lineWidth = b.r * 1.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(x - b.vx * len, y - b.vy * len); g.stroke(); g.lineCap = 'butt';
    }
    if (b.eng.indexOf('magnet') >= 0) { g.strokeStyle = 'rgba(255,230,180,.08)'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 60 + Math.sin(t * 3) * 6, 0, TAU); g.stroke(); }
    drawMarble(g, x, y, b.r, b.r * pxk, b.mat, b.eng, b.spin);
    if (b.frozen > 0) { g.fillStyle = 'rgba(200,235,255,.42)'; circle(g, x, y, b.r + 1); g.strokeStyle = '#e8f8ff'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, b.r + 2, 0, TAU); g.stroke(); }
    if (b.charged > 0) { g.strokeStyle = (b.chargeMult === 3 ? '#ffb3d9' : '#f6cd63'); g.lineWidth = 2; g.setLineDash([4, 4]); g.lineDashOffset = -t * 30; g.beginPath(); g.arc(x, y, b.r + 4, 0, TAU); g.stroke(); g.setLineDash([]); }
    if (b.kiss) { g.strokeStyle = '#ff8fd1'; g.lineWidth = 2.5; g.beginPath(); g.arc(x, y, b.r + 5, 0, TAU); g.stroke(); }
    if (b.bhT > 0) {
      const r2 = 30 + 18 * Math.sin(t * 10);
      g.fillStyle = 'rgba(10,0,24,.55)'; circle(g, x, y, r2); g.strokeStyle = '#d7b0ff'; g.lineWidth = 3;
      g.beginPath(); g.arc(x, y, r2, t * 6, t * 6 + 4.5); g.stroke();
    }
    if (b.lastShot) { g.strokeStyle = 'rgba(246,205,99,.85)'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, b.r + 3, 0, TAU); g.stroke(); }
    if (b.eng.indexOf('bomb') >= 0 && !b.bombed && b.bombHits >= 5 && Math.sin(t * 18) > 0) { g.strokeStyle = '#ff4d6d'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, b.r + 4, 0, TAU); g.stroke(); }
  }
  FX.drawWorld(g);
  // the lamp: a warm light over the table that swells with Chaos and Frenzy
  if (add) {

const UI = {
  scr: $('screen'), modal: $('modal'), cd: $('countdown'), rot: $('rotate'), pauseBtn: $('pauseBtn'), bankBtn: $('bankBtn'), ffBtn: $('ffBtn'), toasts: $('toasts'),
  name: null, back: null, bankHidden: true, bankLabel: '', vis: {},
  setVis(el, on) { const k = el.id; if (this.vis[k] === on) return; this.vis[k] = on; el.classList.toggle('hidden', !on); },
  screenOpen() { return !this.scr.classList.contains('hidden') || !this.modal.classList.contains('hidden'); },
  show(name, html, see) {
    this.name = name; this.scr.className = (see ? 'see ' : '') + 'fadein'; this.scr.innerHTML = html; this.scr.scrollTop = 0;
    this.paintPreviews(this.scr);
    const first = this.scr.querySelector('.btn.primary');
    if (first && !Platform.isTouch) first.focus({ preventScroll: true });
  },
  hide() { this.name = null; this.scr.className = 'hidden'; this.scr.innerHTML = ''; },
  layoutButtons() {
    const left = SAVE.settings.hand === 'left';
    this.pauseBtn.style.left = left ? (L.colX + 8) + 'px' : 'auto';
    this.pauseBtn.style.right = left ? 'auto' : (L.vw - L.colX - L.colW + 8) + 'px';
    this.bankBtn.style.top = (L.trayY + 72) + 'px';
    this.ffBtn.style.top = (L.trayY + 72) + 'px';
    this.toasts.style.top = (L.sat + 6) + 'px';
  },
  frame() {
    const run = App.run;
    const play = App.state === 'play' && run && run.phase === 'play' && !App.paused && App.countdown <= 0 && !App.cdWaiting;
    this.setVis(this.pauseBtn, play && !this.screenOpen());
    const bank = play && run.canBank();
    // fast-forward is offered once the target is met and the board is still settling
    const ff = play && run.cleared && !bank && (run.anyMoving() || run.echoes.length > 0 || run.pendingBoom.length > 0);
    if (!ff && App.ff && !(play && run.forceSettle)) App.ff = false;   // the board settled (or the room ended): back to normal speed
    this.setVis(this.bankBtn, bank); this.setVis(this.ffBtn, ff); this.bankHidden = !(bank || ff);
    if (ff) {
      const label = App.ff ? '▶ NORMAL SPEED' : '⏩ FAST FORWARD 3×';
      if (label !== this.ffLabel) { this.ffBtn.textContent = label; this.ffBtn.classList.toggle('on', App.ff); this.ffLabel = label; }
    }
    if (bank) {
      const left = Math.max(1, Math.ceil(T.AUTO_BANK - (run.stillTicks * T.STEP - T.STOP_HOLD)));
      const label = 'CASH OUT ▶ +' + (run.hand.length * 3) + '●  (' + left + ')';
      if (label !== this.bankLabel) { this.bankBtn.textContent = label; this.bankLabel = label; }
    }
  },
  paintPreviews(root) {
    root.querySelectorAll('canvas.mprev').forEach(c => {
      const css = c.classList.contains('sm') ? 44 : 64, d = Math.min(3, window.devicePixelRatio || 1);
      c.width = c.height = Math.round(css * d);
      const g = c.getContext('2d'), [mat, engs] = c.dataset.m.split('|'), eng = engs ? engs.split(',') : [];
      g.setTransform(d, 0, 0, d, 0, 0);
      const R = css * 0.4 * (MATS[mat].r / 11 > 1.2 ? 1.12 : 1);
      drawMarble(g, css / 2, css / 2, R, R * d, mat, eng, 0.4);
    });
  },
  // Explains the selected marble's material and engravings (one at a time, replaces the last tip).
  marbleTip(m) {
    if (this.tipEl) this.tipEl.remove();
    const d = document.createElement('div'); d.className = 'toast'; d.style.borderColor = '#4cc9f0'; d.innerHTML = marbleDetails(m);
    this.toasts.appendChild(d); this.tipEl = d; setTimeout(() => { d.remove(); if (this.tipEl === d) this.tipEl = null; }, 2900);
  },
  toast(html) {
    const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = html; this.toasts.appendChild(d);
    setTimeout(() => d.remove(), 2900);
    while (this.toasts.children.length > 3) this.toasts.firstChild.remove();
  },
  confirm(text, yes, onYes) {
    this.modal.innerHTML = '<div class="box"><p class="txt center" style="font-size:19px;font-weight:800">' + text + '</p><div class="row"><button class="btn" data-act="modalNo">Cancel</button><button class="btn primary" style="font-size:20px;min-height:56px" data-act="modalYes">' + yes + '</button></div></div>';
    this.modal.classList.remove('hidden'); this.onYes = onYes;
  },
  showText(title, text) {
    this.modal.innerHTML = '<div class="box"><h2>' + esc(title) + '</h2><textarea readonly>' + esc(text) + '</textarea><p class="muted center">Select the text and copy it.</p><button class="btn primary" data-act="modalNo">Done</button></div>';
    this.modal.classList.remove('hidden'); this.onYes = null;
    const ta = this.modal.querySelector('textarea'); setTimeout(() => { try { ta.focus(); ta.select(); } catch (e) {} }, 50);
  },
  closeModal() { this.modal.classList.add('hidden'); this.modal.innerHTML = ''; this.onYes = null; },
  showCountdown(waiting) {
    this.cd.classList.remove('hidden');
    this.cd.innerHTML = waiting ? '<div class="t">TAP TO CONTINUE</div>' : '<div class="n">3</div>';
  },
  setCountdown(n) { const el = this.cd.querySelector('.n'); if (el && el.textContent !== String(n)) { el.textContent = n; Sound.tick(); } },
  hideCountdown() { this.cd.classList.add('hidden'); this.cd.innerHTML = ''; },
  focusables() { const root = !this.modal.classList.contains('hidden') ? this.modal : this.scr; return Array.from(root.querySelectorAll('button:not([disabled])')).filter(b => b.dataset.act); },
  moveFocus(dir) {
    const f = this.focusables(); if (!f.length) return;
    let i = f.indexOf(document.activeElement); i = i < 0 ? 0 : (i + dir + f.length) % f.length;
    f[i].focus(); f[i].scrollIntoView({ block: 'nearest' });
  },
  clickFocused() { const f = this.focusables(); const el = f.indexOf(document.activeElement) >= 0 ? document.activeElement : (this.scr.querySelector('.btn.primary') || f[0]); if (el) el.click(); },
  goBack() {
    if (!this.modal.classList.contains('hidden')) { this.closeModal(); return; }
    if (this.back) { const b = this.back; b(); }
  },
};

function cardInfo(c) {
  switch (c.kind) {
    case 'engrave': return { tag: 'ENGRAVE', name: ENGS[c.eng].name, desc: ENGS[c.eng].desc + ' Choose a marble.', prev: prevCanvas('clay', [c.eng]) };
    case 'reforge': return { tag: 'REFORGE', name: MATS[c.mat].name, desc: MATS[c.mat].desc + ' Choose a marble to convert.', prev: prevCanvas(c.mat, []) };
    case 'newMarble': return { tag: 'NEW MARBLE', name: marbleName(c), desc: (c.eng.length ? ENGS[c.eng[0]].desc : MATS[c.mat].desc) + (sizeOf(c).name ? ' ' + sizeOf(c).desc : '') + ' Joins your bag.', prev: prevCanvas(c.mat, c.eng) };
    case 'polishAll': return { tag: 'POLISH', name: 'Golden Polish', desc: 'Every marble in your bag gains a level.', prev: '<div class="badge" style="background:#4a3a00;border-color:#ffd166;color:#ffd166;font-size:24px">LV↑</div>' };
    case 'polish': if (c.amount === 2) return { tag: 'POLISH', name: 'Master Polish', desc: 'One marble gains 2 levels.', prev: '<div class="badge" style="background:#4a3a00;border-color:#ffd166;color:#ffd166;font-size:22px">LV++</div>' };
      return { tag: 'POLISH', name: 'Level Up', desc: 'One marble gains a level: +50% points per level.', prev: '<div class="badge" style="background:#4a3a00;border-color:#ffd166;color:#ffd166;font-size:24px">LV+</div>' };
    case 'charm': return { tag: 'CHARM', name: CHARMS[c.charm].name, desc: CHARMS[c.charm].desc, prev: '<div class="badge">' + CHARMS[c.charm].glyph + '</div>', charm: true };
  }
  return { tag: '', name: '', desc: '', prev: '' };
}

function showPick(viewOnly, backFn) {

function shopItemInfo(it) {
  if (it.kind === 'marble') return { name: (it.rarity && it.rarity !== 'c' ? RARITY[it.rarity].name.charAt(0) + RARITY[it.rarity].name.slice(1).toLowerCase() + ' · ' : '') + marbleName(it), desc: ENGS[it.eng[0]].desc + (it.eng[1] ? ' Also: ' + ENGS[it.eng[1]].name + '.' : ''), prev: prevCanvas(it.mat, it.eng, true) };

function clearedLine(lc) {
  const parts = [co('+' + lc.coins)];
  if (lc.overkill > 0) parts.push('overkill ' + fmt(lc.overkill));
  if (lc.left > 0) parts.push(lc.left + ' unused \u2192 +' + fmt(lc.leftBonus) + ' pts');
  return fmt(lc.score) + ' / ' + fmt(lc.target) + ' \u00B7 ' + parts.join(' \u00B7 ');
}
function nextRoomText(run) {
  const next = run.roomIdx + 1;

}
function shopHint(run) {
  let n = run.roomIdx + 1; while (!isShopRoom(n)) n++;
  return n === run.roomIdx + 1 ? 'The shop opens after the next room.' : 'The shop opens after room ' + n + '.';

}

/* =========================== 11. APP / MAIN LOOP =========================== */
const App = {

  afterChoice() {

  onRoomEnd() {

  },
  checkGoals() {

};
function pickChallenges(daily) {
  const rng = daily ? RNG(hash32('chal|' + todayStr())) : RNG((Math.random() * 4294967296) >>> 0);
  return rng.shuffle(CHALLENGES.slice()).slice(0, 3);
}
function startRun(mode, seed, opts) {
  Sound.unlock();
  const daily = mode === 'daily', st = SAVE.settings;
  const cfg = opts && opts.cfg ? opts.cfg : daily
    ? { v: GAME_VERSION, mode: 'daily', seed: hash32('CLACK-DAILY-' + todayStr()), loadout: 'classic', pool: ALL_POOL, hard: false, assist: st.assist, perks: [], coins: 0 }

  FX.reset(); Input.reset(); Input.lx = T.W / 2; Input.ly = T.H * 0.8;
  App.run = new Run(cfg, true);
  const rec = opts && opts.ghost ? opts.ghost : daily ? (SAVE.daily.date === todayStr() ? SAVE.daily.record : null) : SAVE.ghost;
  App.rival = opts && opts.rival ? opts.rival : null;
  App.ghost = rec && rec.cfg && rec.v === GAME_VERSION ? new Ghost(rec) : null;
  App.ghostVisible = !!(App.ghost && rec.cfg.seed === cfg.seed);
  App.bestForMode = App.rival ? App.rival.s : daily ? (SAVE.daily.date === todayStr() ? SAVE.daily.best : 0) : SAVE.stats.bestScore;
  App.challenges = pickChallenges(daily); App.chalDone = {}; App.goalShards = 0; App.overInfo = null;
  App.ini = (SAVE.initials || 'AAA').padEnd(3, 'A').slice(0, 3).split('');
  App.state = 'play'; App.paused = false; App.countdown = 0; App.cdWaiting = false; App.acc = 0; App.slowT = App.stopT = 0; App.ff = false; App.pbShown = false; App.zoom = null; App.tapHint = 0; App.bufferedFling = null;
  UI.hide(); UI.closeModal(); UI.hideCountdown();
  Sound.Music.setMode('play'); Platform.wake.request();
  handleEvents(App.run, false);
}
/* ---------------- friend challenges: your exact run, sent as a link ---------------- */
const ACT_CODES = ['fling', 'kick', 'bank', 'card', 'skip', 'target', 'cancel', 'buy', 'reroll', 'leave', 'select'];
function packRecord(rec) {
  let lt = 0; const a = [];
  for (const x of rec.actions) {
    const row = [x.t - lt, ACT_CODES.indexOf(x.a)]; lt = x.t;
    if (x.a === 'fling') row.push(x.x, x.y, x.g, x.p); else if (x.i !== undefined) row.push(x.i);
    a.push(row);
  }
  return { v: rec.v, c: rec.cfg, a };
}
function unpackRecord(p) {
  let t = 0;
  const actions = p.a.map(r => { t += r[0]; const o = { a: ACT_CODES[r[1]], t }; if (o.a === 'fling') { o.x = r[2]; o.y = r[3]; o.g = r[4]; o.p = r[5]; } else if (r.length > 2) o.i = r[2]; return o; });

}
const b64e = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = str => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
function challengeLabel(cfg, date) { return cfg.mode === 'daily' ? 'Daily ' + date : (cfg.from === 'daily' ? 'Daily ' + date : 'Endless \u00B7 seed ' + seedStr(cfg.seed)); }
function decodeChallenge(code) {
  try {
    const p = JSON.parse(b64d(code)), rec = unpackRecord(p.r);
    if (rec.v !== GAME_VERSION) return null;
    const rep = replayRun(rec);                         // re-simulate their inputs: the score must match exactly
    return { code, n: String(p.n || '???').slice(0, 3), s: p.s | 0, d: String(p.d || ''), rec, verified: rep.score === (p.s | 0), room: rep.roomIdx, label: challengeLabel(rec.cfg, p.d) };
  } catch (e) { return null; }
}
async function shareChallenge() {
  const run = App.run; if (!run || run.cfg.assist) return;
  const payload = { n: App.ini.join(''), s: run.score, d: todayStr(), r: packRecord(run.record) };
  const link = location.href.split('#')[0] + '#c=' + b64e(JSON.stringify(payload));
  const text = 'I scored ' + fmt(run.score) + ' in CLACK (' + challengeLabel(run.cfg, todayStr()) + '). Same rooms, my ghost races you. Beat me:';
  const res = await Platform.share(text + '\n' + link);
  if (res === 'copied') UI.toast('Challenge link copied'); else if (res === 'manual') UI.showText('Send this challenge', text + '\n' + link);
}
function showChallenge(ch) {
  UI.back = showTitle; App.state = 'title';
  UI.show('challenge', '<div class="col"><h2>Challenge!</h2><div class="spacer"></div>' +
    '<div class="panel center"><p style="font-size:22px;font-weight:900">' + esc(ch.n) + ' scored ' + fmt(ch.s) + '</p><p class="muted" style="font-weight:800">' + esc(ch.label) + ' \u00B7 reached room ' + ch.room + '</p>' +
    '<p style="font-weight:900;color:' + (ch.verified ? 'var(--good)' : 'var(--bad)') + '">' + (ch.verified ? '\u2713 Verified: their run was replayed and matches' : '\u26A0 This score didn\u2019t match a replay') + '</p></div>' +
    '<p class="center muted">Same rooms, same upgrades offered. Their ghost marbles race you.</p>' +
    '<div class="spacer"></div><div class="foot"><button class="btn primary" data-act="raceChallenge">RACE THEIR GHOST</button><button class="btn small ghost" data-act="back">Not now</button></div></div>');
}
function startChallenge(ch) {
  let idx = SAVE.friends.findIndex(fr => fr.p === ch.code);
  if (idx < 0) { SAVE.friends.unshift({ n: ch.n, s: ch.s, d: ch.d, label: ch.label, verified: ch.verified, p: ch.code, mine: 0 }); if (SAVE.friends.length > 20) SAVE.friends.length = 20; idx = 0; persist(); }
  App.lastChallenge = ch;
  const cfg = JSON.parse(JSON.stringify(ch.rec.cfg)); cfg.from = cfg.mode === 'challenge' ? cfg.from : cfg.mode; cfg.mode = 'challenge';
  startRun('challenge', null, { cfg, ghost: ch.rec, rival: { n: ch.n, s: ch.s, idx } });
  App.ghostVisible = true;
}
function gameTick() {
  const run = App.run;
  if (App.bufferedFling) {
    if (run.canFling()) { run.act(App.bufferedFling.act); App.bufferedFling = null; }
    else if (App.time > App.bufferedFling.until || !run.hand.length) App.bufferedFling = null;
  }
  const wasPlay = run.phase === 'play';
  run.step();
  if (wasPlay && App.ghost) App.ghost.advance();

}
function pauseGame() {
  if (App.state !== 'play' || !App.run || App.run.phase !== 'play') return;
  if (App.paused && !App.countdown && !App.cdWaiting) return;
  App.paused = true; App.ff = false; App.countdown = 0; App.cdWaiting = false; UI.hideCountdown(); Input.reset();
  Platform.wake.release(); persist(); showPause();
}
function resumeGame() { UI.hide(); App.cdWaiting = false; startCountdown(); }
function startCountdown() { App.cdWaiting = false; App.countdown = 1.8; UI.showCountdown(false); Sound.resume(); Sound.unlock(); Platform.wake.request(); }
function countdownUpdate(dt) {
  if (App.countdown <= 0) return;
  App.countdown -= dt;
  if (App.countdown <= 0) { App.countdown = 0; App.paused = false; UI.hideCountdown(); return; }
  UI.setCountdown(Math.ceil(App.countdown / 0.6));
}
function newAttract() {
  const r = new Run({ v: GAME_VERSION, mode: 'attract', seed: (Math.random() * 4294967296) >>> 0, loadout: 'chaos', pool: ALL_POOL, hard: false, assist: false, perks: [], coins: 0 }, true);
  r.bag.push(r.newMarble('glass', ['spark'], 1), r.newMarble('steel', ['bomb'], 1), r.newMarble('rubber', ['crown'], 1));
  r.startRoom(1 + Math.floor(Math.random() * 6));
  if (r.mut === 'blackout') r.mut = null;
  r.events.length = 0;
  App.attract = r; App.attractNext = 0.6; App.attractEnd = 0;
}
function attractUpdate(dt) {
  const r = App.attract; if (!r) return;
  App.attractAcc += dt; let n = 0;
  while (App.attractAcc >= T.STEP && n < T.MAX_STEPS) { r.step(); App.attractAcc -= T.STEP; n++; }
  if (n >= T.MAX_STEPS) App.attractAcc = 0;
  App.attractNext -= dt;
  if (r.phase === 'play' && r.canFling() && App.attractNext <= 0) {
    r.act({ a: 'fling', x: Math.round((40 + Math.random() * 280) * 10), y: Math.round((120 + Math.random() * 380) * 10), g: Math.round(Math.random() * TAU * 10000), p: Math.round((0.6 + Math.random() * 0.4) * 1000) });
    Input.lx = clamp(r.marbles.length ? r.marbles[r.marbles.length - 1].x : T.W / 2, 18, T.W - 18);
    App.attractNext = 0.7 + Math.random() * 0.9;
  }
  if (r.phase !== 'play' || (!r.hand.length && !r.anyMoving())) { App.attractEnd += dt; if (App.attractEnd > 1.2) newAttract(); }
  handleEvents(r, true);
}
function onResize() {
  computeLayout();
  const landscapePhone = L.vw > L.vh && Platform.isTouch && L.vh < 520;
  UI.rot.classList.toggle('hidden', !landscapePhone);
  if (landscapePhone) pauseGame();
}
function frame(now) {
  requestAnimationFrame(frame);
  if (SAVE.settings.lowPower && now - App.lastDraw < 1000 / 30 - 2) return;   // 30 fps cap
  let dt = (now - App.last) / 1000; App.last = now; App.lastDraw = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  App.time += dt;

  pollGamepad(dt); keyboardUpdate(dt);
  let ts = 1;

  else if (App.stopT > 0) { App.stopT -= dt; ts = 0.05; } else if (App.slowT > 0) { App.slowT -= dt; ts = 0.35; }
  if (App.state === 'play' || App.state === 'over') {
    const run = App.run;
    if (run && App.state === 'play' && !App.paused && App.countdown <= 0 && run.phase === 'play') {
      App.acc += dt * ts; let n = 0;
      const maxSteps = App.ff ? T.MAX_STEPS * 4 : T.MAX_STEPS;

      if (n >= maxSteps) App.acc = 0;
    }
    if (run) { handleEvents(run, false); Sound.Music.setLevel(run.phase === 'play' ? run.chaosLvl : 0); }
    App.goalT += dt; if (App.goalT > 0.5 && run && run.phase === 'play') { App.goalT = 0; App.checkGoals(); }
  } else if (App.state === 'title') attractUpdate(dt);

  UI.frame();
  FX.update(dt * (App.stopT > 0 ? 0.25 : ts < 1 ? 0.6 : 1));
  const alpha = App.state === 'title' ? clamp(App.attractAcc / T.STEP, 0, 1) : clamp(App.acc / T.STEP, 0, 1);

}

/* ------------------------- PWA: inline manifest + icons ------------------------- */
function makeIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  g.fillStyle = '#0b1f18'; g.fillRect(0, 0, size, size);
  const grd = g.createRadialGradient(size / 2, size * 0.45, size * 0.05, size / 2, size / 2, size * 0.7); grd.addColorStop(0, '#1d6b51'); grd.addColorStop(1, '#0b1f18');
  g.fillStyle = grd; g.fillRect(0, 0, size, size);

  drawMarble(g, size * 0.38, size * 0.55, R, R, 'clay', [], 0.6);
  drawMarble(g, size * 0.64, size * 0.42, R * 0.9, R * 0.9, 'glass', ['spark'], 0);
  g.strokeStyle = '#ffd166'; g.lineWidth = size * 0.025; g.lineCap = 'round';

  return c.toDataURL('image/png');
}
function setupPWA() {
  try {
    const i192 = makeIcon(192), i512 = makeIcon(512);
    const manifest = { name: 'CLACK: Marble Chaos', short_name: 'CLACK', description: 'One-thumb marble chaos roguelite.', start_url: location.href.split('#')[0], display: 'standalone', orientation: 'portrait', background_color: '#0b1f18', theme_color: '#0b1f18', icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    const link = document.createElement('link'); link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
    const apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = makeIcon(180); document.head.appendChild(apple);
    const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = makeIcon(64); document.head.appendChild(fav);
  } catch (e) {}
}

/* ------------------------------- lifecycle ------------------------------- */
