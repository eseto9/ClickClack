<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1f18">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="format-detection" content="telephone=no">
<meta name="description" content="CLACK: a one-thumb marble chaos roguelite. Fling upgradeable marbles, make everything collide, beat the target.">
<title>CLACK</title>
<style>
/* ============================== STYLES ============================== */
:root{
  --bg:#0b1f18; --panel:#123329; --panel2:#1b4537; --panel3:#245a48; --line:#2f6652;
  --ink:#fff7e6; --muted:#b9ccc1; --accent:#ffb627; --accent-ink:#2a1a00;
  --blue:#4cc9f0; --good:#8be28b; --bad:#ff6b7f; --gold:#ffd166; --shard:#9be7ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100vh;height:100dvh}
canvas#game{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* in-game floating buttons */
.iconbtn{position:absolute;pointer-events:auto;width:52px;height:52px;border-radius:16px;border:2px solid rgba(255,255,255,.18);
  background:rgba(10,28,22,.72);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;
  top:calc(var(--sat) + 8px)}
.iconbtn:active{transform:scale(.94)}
#bankBtn{position:absolute;pointer-events:auto;left:50%;transform:translateX(-50%);min-height:60px;min-width:240px;max-width:calc(100% - 32px);
  border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:21px;font-weight:900;padding:10px 22px;
  box-shadow:0 5px 0 #a8700c,0 8px 22px rgba(0,0,0,.45)}
#bankBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #a8700c}

/* screens */
#screen{position:absolute;inset:0;pointer-events:auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  background:rgba(5,15,11,.86)}
#screen.see{background:linear-gradient(180deg,rgba(5,15,11,.55) 0%,rgba(5,15,11,.15) 30%,rgba(5,15,11,.35) 55%,rgba(5,15,11,.94) 78%)}
#screen.fadein{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.col{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;flex:1 0 auto}
.spacer{flex:1 1 auto;min-height:8px}
.foot{position:sticky;bottom:0;margin:0 -16px calc(-1 * var(--sab) - 16px);padding:14px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,rgba(7,19,14,0) 0%,rgb(7,19,14) 24%);z-index:2}
.li.c{min-height:44px;padding:6px 12px}
.row{display:flex;gap:12px;width:100%}
.row>*{flex:1 1 0}
.btn{appearance:none;border:0;border-radius:16px;min-height:56px;padding:12px 16px;font-size:19px;font-weight:800;line-height:1.15;
  background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-size:25px;font-weight:900;min-height:74px;box-shadow:0 5px 0 #a8700c}
.btn.primary:active{box-shadow:0 1px 0 #a8700c}
.btn.blue{background:var(--blue);color:#05232e;box-shadow:0 4px 0 #1f7c99}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.small{min-height:48px;font-size:17px;padding:8px 12px}
.btn .sub{display:block;font-size:16px;font-weight:700;opacity:.8}
.btn.stack{flex-direction:column;gap:2px}
h1.logo{font-size:min(23vw,108px);font-weight:900;letter-spacing:-.05em;line-height:.9;text-align:center;margin-top:4vh;
  background:linear-gradient(180deg,#fff7e6 0%,#ffd166 55%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
.tag{text-align:center;color:var(--muted);font-size:18px;font-weight:700}
h2{font-size:28px;font-weight:900;text-align:center;letter-spacing:-.01em}
h3{font-size:18px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
p,.txt{font-size:17px;line-height:1.35}
.muted{color:var(--muted)}
.center{text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border-radius:999px;background:var(--panel);border:2px solid var(--line);padding:8px 14px;font-size:16px;font-weight:800;min-height:48px;display:flex;align-items:center;gap:6px}
.coin{color:var(--gold)} .shard{color:var(--shard)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 12px;min-height:56px;font-size:17px}
.li .grow{flex:1;min-width:0}
.li .nm{font-weight:900;font-size:18px}
.li .ds{color:var(--muted);font-size:16px;line-height:1.25}
.li.done{opacity:.6}
.big{font-size:56px;font-weight:900;letter-spacing:-.03em;text-align:center;line-height:1}
.delta{text-align:center;font-size:19px;font-weight:900}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}

/* upgrade cards */
.card{appearance:none;border:3px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:20px;
  min-height:104px;padding:12px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.card .ctext{flex:1;min-width:0}
.card .ctag{font-size:14px;font-weight:900;letter-spacing:.1em;color:var(--accent)}
.card .cname{font-size:22px;font-weight:900;line-height:1.1}
.card .cdesc{font-size:16px;color:var(--muted);line-height:1.25;margin-top:2px}
.card.charm{border-color:#b388ff} .card.charm .ctag{color:#c9a7ff}
.card[disabled]{opacity:.4;pointer-events:none}
.badge{width:64px;height:64px;flex:0 0 64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;
  background:#2a1f4a;border:2px solid #b388ff;color:#e6d9ff}
.badge.sm{width:44px;height:44px;flex-basis:44px;font-size:22px;border-radius:12px}
.mprev{width:64px;height:64px;flex:0 0 64px}
.mprev.sm{width:44px;height:44px;flex-basis:44px}

/* bag grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%}
.tile{appearance:none;border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:8px 4px;min-height:120px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;font-weight:800}
.tile .lv{font-size:14px;color:var(--gold)}
.tile[disabled]{opacity:.32;pointer-events:none}
.tile.view{pointer-events:none}

/* shop items */
.shopitem{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:10px;min-height:84px}
.shopitem .grow{flex:1;min-width:0}
.shopitem .btn{min-width:88px}
.shopitem.sold{opacity:.4}

/* tabs */
.tabs{display:flex;gap:8px;width:100%}
.tabs .btn{flex:1;min-height:52px;font-size:17px}
.tabs .btn.on{background:var(--blue);color:#05232e}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-radius:14px;padding:8px 8px 8px 14px;min-height:64px}
.set .lbl{font-size:18px;font-weight:800}
.set .lbl small{display:block;font-size:16px;font-weight:600;color:var(--muted)}
.tog{min-width:96px;min-height:52px;border-radius:999px;border:0;font-size:17px;font-weight:900;background:#3b4a44;color:#cfd8d3}
.tog.on{background:var(--good);color:#0b2a0f}
.seg{display:flex;gap:6px}
.seg button{min-width:64px;min-height:52px;border-radius:12px;border:0;background:#2f3d38;color:#d8e2dd;font-size:16px;font-weight:900}
.seg button.on{background:var(--blue);color:#05232e}

/* initials picker */
.ini{display:flex;gap:14px;justify-content:center;align-items:center}
.ini .slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.ini .slot button{width:56px;height:52px;border-radius:12px;border:0;background:var(--panel2);font-size:20px;font-weight:900}
.ini .slot .ch{font-size:40px;font-weight:900;width:56px;text-align:center;line-height:1.1}

/* overlays */
#modal{position:absolute;inset:0;pointer-events:auto;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
#modal .box{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
#modal textarea{width:100%;min-height:110px;border-radius:12px;padding:10px;font-size:16px;background:#0a1a14;color:var(--ink);border:2px solid var(--line);user-select:text;-webkit-user-select:text;touch-action:auto}
#countdown{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,12,9,.55);z-index:4}
#countdown .n{font-size:120px;font-weight:900;color:var(--ink);text-shadow:0 6px 0 rgba(0,0,0,.5)}
#countdown .t{font-size:24px;font-weight:900;color:var(--accent)}
#rotate{position:absolute;inset:0;pointer-events:auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;font-size:22px;font-weight:900}
#rotate .ph{width:60px;height:100px;border:5px solid var(--ink);border-radius:14px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
#toasts{position:absolute;left:0;right:0;top:calc(var(--sat) + 120px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:6;pointer-events:none}
.toast{background:rgba(18,51,41,.95);border:2px solid var(--accent);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:17px;font-weight:800;
  max-width:90vw;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:toast 2.8s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#screen.fadein,.toast{animation:none}}
.rm .toast{animation:none}
</style>
</head>
<body>
<canvas id="game" tabindex="-1" aria-label="CLACK game board"></canvas>
<div id="ui">
  <button id="pauseBtn" class="iconbtn hidden" aria-label="Pause">&#10074;&#10074;</button>
  <button id="bankBtn" class="hidden" aria-label="Cash out">CASH OUT &#9654;</button>
  <div id="toasts" aria-live="polite"></div>
  <div id="screen" class="hidden"></div>
  <div id="countdown" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="rotate" class="hidden"><div class="ph"></div><div>Turn your phone upright</div></div>
</div>
<div id="safeProbe"></div>
<script>
'use strict';
/* =====================================================================
   CLACK: one-thumb marble chaos roguelite
   ---------------------------------------------------------------------
   1. TUNING CONSTANTS
   2. PLATFORM LAYER (storage, haptics, share, wake lock): swap for native plugins
   3. SEEDED RNG
   4. CONTENT DATA (materials, engravings, charms, unlocks, challenges, achievements)
   5. SAVE SYSTEM (versioned key + migration)
   6. AUDIO ENGINE (procedural SFX + adaptive layered music)
   7. SIMULATION (deterministic Run: physics, scoring, rooms, rewards, shop). No DOM, audio or Math.random.
   8. FX + RENDERING (canvas)
   9. UI SCREENS (DOM)
   10. INPUT (pointer, keyboard, gamepad)
   11. APP / MAIN LOOP
   ===================================================================== */

/* ======================= 1. TUNING CONSTANTS ======================= */
const GAME_VERSION = 4;             // bump when sim rules change (invalidates old ghosts)
const T = {
  W: 360, H: 540,                   // arena size in world units
  STEP: 1 / 120,                    // fixed simulation step (seconds)
  MAX_STEPS: 16,                    // max sim steps per frame (spiral-of-death guard)
  RAIL: 24,                         // legacy default drop height (old records without y)
  LAUNCH_MIN: 280, LAUNCH_MAX: 1180,// launch speed range (units/s)
  MIN_POWER: 0.02,                  // pulls weaker than this are cancelled
  CANCEL_R: 40,                     // CSS px: drag back inside this circle to cancel the shot
  FLING_COOLDOWN: 0.2,              // seconds between flings
  INPUT_BUFFER: 0.3,                // a fling during cooldown is buffered this long
  DAMP: 0.3, DECEL: 18,             // rolling friction: proportional + constant (low = long rolls)
  STOP: 8,                          // below this speed a marble counts as resting
  SPEED_CAP: 1700,
  WALL_E: 0.87, MARBLE_E: 0.92, BUMPER_E: 0.78, BLOCK_E: 0.75,
  BUMPER_KICK: 220,                 // speed a bumper adds
  HIT_MIN: 45,                      // minimum impact speed that scores
  PAIR_CD: 0.15,                    // same pair can't score twice within this
  CHAOS_ADD: 5, CHAOS_DECAY: 20, CHAOS_GRACE: 0.5, CHAOS_MAX: 110,
  CHAOS_LEVELS: [
    { at: 0, mult: 1, name: '' }, { at: 15, mult: 2, name: 'WARM' }, { at: 35, mult: 3, name: 'HOT' },
    { at: 60, mult: 5, name: 'WILD' }, { at: 90, mult: 8, name: 'RIOT!' }],
  HAND: 5, KICKS: 2, KICK_MULT: 1.45, KICK_COYOTE: 0.25,
  SETTLE_AFTER: 9, SETTLE_IDLE: 20, HARD_STOP: 8,
  STOP_HOLD: 0.45, AUTO_BANK: 5,
  TARGET_BASE: 350, TARGET_GROWTH: 1.5, LATE_GROWTH: 1.08,
  HARD_TARGET: 1.6, ASSIST_TARGET: 0.75, HARD_SCORE_BONUS: 0.5,
  BOSS_EVERY: 4, MAX_MARBLES: 48, CHARM_SLOTS: 4, ENG_SLOTS: 2, MAX_LVL: 5,
  ORB_CHANCE: 0.35, ORB_LIFE: 8,
  SHARDS_PER_SCORE: 400, SHARDS_SCORE_CAP: 60,
  DPR_CAP: 2,
  PARTICLES: [90, 200, 380],        // particle budget per quality level
};

/* =================== 2. PLATFORM ABSTRACTION LAYER ==================
   Everything platform-specific lives here so a native wrapper
   (e.g. Capacitor Preferences / Haptics / Share / KeepAwake) can replace it. */
const Platform = (() => {
  const mem = {};
  let lsOk = false;
  try { const k = '__clack_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); lsOk = true; } catch (e) { lsOk = false; }
  const storage = {
    get(key) {
      try { if (lsOk) { const v = localStorage.getItem(key); if (v != null) return JSON.parse(v); } } catch (e) {}
      try { return key in mem ? JSON.parse(mem[key]) : null; } catch (e) { return null; }
    },
    set(key, val) {
      let s; try { s = JSON.stringify(val); } catch (e) { return; }
      mem[key] = s;
      try { if (lsOk) localStorage.setItem(key, s); } catch (e) {}
    },
    remove(key) { delete mem[key]; try { if (lsOk) localStorage.removeItem(key); } catch (e) {} },
    get persistent() { return lsOk; },
  };
  let hapticsOn = true, lastVib = 0;
  const haptics = {
    set(on) { hapticsOn = !!on; },
    play(pattern) {
      if (!hapticsOn) return;
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      const now = performance.now(); if (now - lastVib < 45) return; lastVib = now;
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
    },
  };
  async function share(text) {
    try { if (navigator.share) { await navigator.share({ title: 'CLACK', text }); return 'shared'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return 'copied'; } } catch (e) {}
    return 'manual';
  }
  let lock = null;
  const wake = {
    async request() {
      try {
        if ('wakeLock' in navigator && !lock && document.visibilityState === 'visible') {
          lock = await navigator.wakeLock.request('screen');
          lock.addEventListener('release', () => { lock = null; });
        }
      } catch (e) { lock = null; }
    },
    release() { try { if (lock) lock.release(); } catch (e) {} lock = null; },
  };
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  return { storage, haptics, share, wake, isTouch };
})();
const HAPTIC = { tap: [6], hit: [9], bumper: [5], near: [14, 40, 14], pickup: [10, 30, 10], boom: [35], death: [60, 50, 140], clear: [15, 40, 15, 40, 30], kick: [12] };

/* =========================== 3. SEEDED RNG ========================== */
function hash32(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function RNG(seed) {
  let a = seed >>> 0;
  const r = {
    next() { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
    range(lo, hi) { return lo + (hi - lo) * r.next(); },
    int(lo, hi) { return lo + Math.floor(r.next() * (hi - lo + 1)); },
    pick(arr) { return arr[Math.floor(r.next() * arr.length)]; },
    chance(p) { return r.next() < p; },
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r.next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
  };
  return r;
}
function weighted(rng, list) {
  let tot = 0; for (const it of list) tot += it[1];
  let x = rng.next() * tot;
  for (const it of list) { x -= it[1]; if (x < 0) return it[0]; }
  return list[list.length - 1][0];
}
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => Math.round(n).toLocaleString('en-US');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const seedStr = s => (s >>> 0).toString(16).toUpperCase().padStart(8, '0');

/* ========================= 4. CONTENT DATA ========================== */
const MATS = {
  clay:   { name: 'Clay',   desc: 'Plain and dependable.',                      r: 11, mass: 1,   val: 1,    fric: 1,    wallE: null, launch: 1,    c1: '#f2dfbb', c2: '#c8743f' },
  steel:  { name: 'Steel',  desc: 'Heavy: big knockback, worth ×1.3.',          r: 12, mass: 2.4, val: 1.3,  fric: 0.9,  wallE: null, launch: 0.95, c1: '#e3eaef', c2: '#5f6d79' },
  rubber: { name: 'Rubber', desc: 'Walls never slow it down.',                  r: 11, mass: 0.8, val: 1,    fric: 1.05, wallE: 1.0,  launch: 1,    c1: '#ff7fa0', c2: '#b0244f' },

    shards: 0, owned: {}, achievements: {}, initials: 'AAA', tutorialDone: false,
    stats: { runs: 0, bestScore: 0, bestRoom: 0, bestChain: 0, bestChaos: 1, longestRun: 0, totalScore: 0, totalRooms: 0, golden: 0, glass: 0, kisses: 0, shardsEarned: 0, dailyRuns: 0 },
    top10: [], daily: { date: '', best: 0, record: null }, ghost: null,
  };
}
function deepFill(target, defs) {
  for (const k in defs) {
    const dv = defs[k], tv = target[k];
    const dIsObj = dv && typeof dv === 'object' && !Array.isArray(dv);
    if (tv === undefined || (dIsObj && (tv === null || typeof tv !== 'object' || Array.isArray(tv))) || (Array.isArray(dv) && !Array.isArray(tv)) || (typeof dv === 'number' && typeof tv !== 'number') || (typeof dv === 'boolean' && typeof tv !== 'boolean')) {

    } else if (dIsObj && Object.keys(dv).length) deepFill(tv, dv);

}
// Upgrades any older save shape to the current one without losing progress.
function migrate(raw) {
  let d = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  const v = d.v | 0;
  if (v < 1) {
    // v0 (prototype) stored a flat { best, runs } object.
    if (typeof d.best === 'number') { d.stats = Object.assign({}, d.stats || {}, { bestScore: d.best }); delete d.best; }
    if (typeof d.runs === 'number') { d.stats = Object.assign({}, d.stats || {}, { runs: d.runs }); delete d.runs; }
  }
  // Future: if (v < 2) { ...transform... }
  d = deepFill(d, defaultSave());
  if (!THEMES[d.settings.theme]) d.settings.theme = 'felt';
  if (!LOADOUTS[d.settings.loadout]) d.settings.loadout = 'classic';
  d.settings.sensitivity = clamp(d.settings.sensitivity | 0, 0, 2);
  d.v = SAVE_VERSION;

  let raw = Platform.storage.get(SAVE_KEY);
  if (!raw) for (const k of LEGACY_KEYS) { const r = Platform.storage.get(k); if (r) { raw = r; break; } }
  try { return migrate(raw); } catch (e) { return defaultSave(); }
}
let SAVE = loadSave();
function persist() { Platform.storage.set(SAVE_KEY, SAVE); }

function currentPool() {
  const p = { mats: BASE_POOL.mats.slice(), engs: BASE_POOL.engs.slice(), charms: BASE_POOL.charms.slice() };
  for (const u of UNLOCKS) if (u.grant && owns(u.id)) for (const k of ['mats', 'engs', 'charms']) if (u.grant[k]) p[k].push(...u.grant[k]);

function drawFog(g, run, alpha) {
  const f = fogC.getContext('2d'), d = L.dpr, s = L.s;
  f.setTransform(1, 0, 0, 1, 0, 0); f.globalCompositeOperation = 'source-over';
  f.fillStyle = 'rgba(2,6,5,.93)'; f.fillRect(0, 0, fogC.width, fogC.height);
  f.globalCompositeOperation = 'destination-out';
  const light = glowSprite('rgba(255,255,255,1)');
  const hole = (x, y, r) => f.drawImage(light, (x - r) * s * d, (y - r) * s * d, r * 2 * s * d, r * 2 * s * d);
  for (const b of run.marbles) if (b.alive) { const x = b.px + (b.x - b.px) * alpha, y = b.py + (b.y - b.py) * alpha; hole(x, y, 75); }
  if (Input.pid !== null || Input.keyShowT > 0) hole(Input.lx, Input.ly, 60);
  if (run.orb) hole(run.orb.x, run.orb.y, 40);
  for (const h of run.holes) hole(h.x, h.y, 34);
  for (const sp of run.spikes) hole(sp.x, sp.y, 30);
  f.globalCompositeOperation = 'source-over';
  g.drawImage(fogC, 0, 0, T.W, T.H);
}

function render(alpha, t, dtF) {
  const g = ctx;
  g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  g.fillStyle = theme.bg; g.fillRect(0, 0, L.vw, L.vh);
  const run = App.state === 'title' ? App.attract : App.run;
  if (!run) return;
  let sx = 0, sy = 0;
  if (FX.shake > 0) { sx = (Math.random() * 2 - 1) * FX.shake; sy = (Math.random() * 2 - 1) * FX.shake; }
  g.drawImage(boardC, L.ax - boardPad + sx, L.ay - boardPad + sy, L.aw + boardPad * 2, L.ah + boardPad * 2);
  g.save(); g.translate(L.ax + sx, L.ay + sy); g.scale(L.s, L.s);
  g.save(); rrect(g, -2, -2, T.W + 4, T.H + 4, 18); g.clip();
  drawWorld(g, run, alpha, t, dtF);
  if (App.state === 'play') drawAim(g, run, t);
  if (run.mut === 'blackout') drawFog(g, run, alpha);
  g.restore(); g.restore();
  if (App.state === 'play') {
    drawChaosFrame(g, run, t);
    drawHUD(g, run, t);
    drawTray(g, run, t);
    drawTutorial(g, run, t);
    if (Input.aiming && Input.pid !== null) {
      const cancel = Input.cancelling(), R = T.CANCEL_R;
      if (!cancel) { g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 3; g.setLineDash([3, 6]); g.beginPath(); g.moveTo(Input.sx, Input.sy); g.lineTo(Input.x, Input.y); g.stroke(); g.setLineDash([]); }
      // cancel zone: drag back into this circle and let go to undo the shot
      g.fillStyle = cancel ? 'rgba(255,93,115,.35)' : 'rgba(0,0,0,.25)'; circle(g, Input.sx, Input.sy, R);
      g.strokeStyle = cancel ? '#ff5d73' : 'rgba(255,255,255,.45)'; g.lineWidth = cancel ? 3 : 2; if (!cancel) g.setLineDash([5, 5]);
      g.beginPath(); g.arc(Input.sx, Input.sy, R, 0, TAU); g.stroke(); g.setLineDash([]);
      const k = R * 0.32; g.lineWidth = 4; g.lineCap = 'round'; g.strokeStyle = cancel ? '#fff' : 'rgba(255,255,255,.55)';
      g.beginPath(); g.moveTo(Input.sx - k, Input.sy - k); g.lineTo(Input.sx + k, Input.sy + k); g.moveTo(Input.sx + k, Input.sy - k); g.lineTo(Input.sx - k, Input.sy + k); g.stroke(); g.lineCap = 'butt';
    }
  }
  FX.drawScreen(g);
  if (FX.flash > 0) { g.globalAlpha = FX.flash * 0.6; g.fillStyle = FX.flashCol; g.fillRect(0, 0, L.vw, L.vh); g.globalAlpha = 1; }
}

/* ------------- presentation reactions to simulation events ------------- */
function handleEvents(run, quiet) {
  const ev = run.events; if (!ev.length) return;
  const snd = !quiet, hap = !quiet ? Platform.haptics : null;
  for (let i = 0; i < ev.length; i++) {
    const e = ev[i];
    switch (e.type) {
      case 'pop':
        if (e.label) FX.pop(e.x, e.y, e.label + (e.label.indexOf('+') < 0 ? ' +' + fmt(e.pts) : ''), '#ffffff', 21, 1.1);
        else if (e.pts >= 12) FX.pop(e.x, e.y, '+' + fmt(e.pts), CHAOS_COL[run.chaosLvl], e.pts >= 300 ? 23 : e.pts >= 80 ? 19 : 16, 0.75);
        break;
      case 'clack': {
        const v = e.v;
        FX.burst(e.x, e.y, 3 + Math.min(8, v / 120), 60 + v * 0.25, '#fff7e6', 1, 1.6, 0.25);
        if (v > 500) FX.addShake(v / 350);
        if (snd) Sound.clack(v, run.chaosLvl);
        if (hap && v > 350) hap.play(HAPTIC.hit);
        if (!quiet) {
          const now = App.time; App.clacks.push(now); while (App.clacks.length && now - App.clacks[0] > 0.45) App.clacks.shift();
          if (App.clacks.length >= 5 && now - App.lastPile > 2.5) { App.lastPile = now; FX.pop(e.x, e.y - 14, 'PILEUP!', '#ff9f1c', 24, 1); }
        }
        break;
      }
      case 'bumper': FX.ring(e.x, e.y, 14, 34, 0.3, e.boss ? '#ff5d73' : theme.bumper, 3); if (snd) Sound.bumper(); if (hap) hap.play(HAPTIC.bumper); break;
      case 'wall': if (snd) Sound.wall(e.v); if (e.v > 300) FX.burst(e.x, e.y, 3, 60, 'rgba(255,255,255,.6)', 0, 1.5, 0.25); break;
      case 'block': FX.burst(e.x, e.y, 4, 90, theme.block, 2, 2, 0.4); if (snd) Sound.block(); break;
      case 'break': FX.burst(e.x, e.y, 14, 220, theme.block, 2, 3, 0.7, 300); FX.burst(e.x, e.y, 6, 160, '#fff', 0, 2, 0.4); FX.addShake(3); if (snd) Sound.breakBlock(); if (hap) hap.play(HAPTIC.hit); break;
      case 'launch': FX.ring(e.x, e.y, 8, 30, 0.25, '#fff', 2); if (snd) Sound.launch(e.p); if (hap) hap.play(HAPTIC.tap); break;
      case 'kick':
        FX.ring(T.W / 2, T.H / 2, 10, 260, 0.45, '#4cc9f0', 4);
        for (const b of run.marbles) if (b.alive && (b.vx || b.vy)) FX.ring(b.x, b.y, b.r, b.r + 16, 0.3, '#4cc9f0', 3);
        if (snd) Sound.kick(); if (hap) hap.play(HAPTIC.kick); break;
      case 'fall': FX.fallers.push({ x: e.x, y: e.y, hx: e.hx, hy: e.hy, mat: e.mat, r: e.r, t: 0 }); if (snd) Sound.fall(); if (hap) hap.play([20]); break;
      case 'popped': FX.burst(e.x, e.y, 14, 200, MATS[e.mat].c1, 2, 2.4, 0.5); FX.ring(e.x, e.y, 6, 30, 0.3, '#ff4d6d', 3); if (snd) Sound.popped(); if (hap) hap.play([25]); break;
      case 'near': FX.ring(e.x, e.y, 8, 40, 0.4, '#fff', 3); App.slowmo(0.35); if (snd) Sound.near(); if (hap) hap.play(HAPTIC.near); break;
      case 'clutch': FX.ring(e.x, e.y, 6, 36, 0.35, '#8be28b', 3); App.slowmo(0.2); if (snd) Sound.clutch(); if (hap) hap.play(HAPTIC.near); break;
      case 'kiss': FX.ring(e.x, e.y, 6, 42, 0.45, '#ff8fd1', 4); App.hitstop(0.08); if (snd) Sound.kiss(); if (hap) hap.play(HAPTIC.pickup); break;
      case 'spark': FX.bolt(e.x1, e.y1, e.x2, e.y2); FX.burst(e.x2, e.y2, 4, 120, '#bde7ff', 1, 1.5, 0.25); if (snd) Sound.spark(); break;
      case 'boom':
        FX.ring(e.x, e.y, 10, e.r, 0.45, e.jackpot ? '#ffd166' : '#ff9f1c', 6); FX.burst(e.x, e.y, e.big ? 40 : 26, e.big ? 420 : 300, '#ffb627', 0, 3, 0.6); FX.burst(e.x, e.y, 12, 200, '#fff', 1, 2, 0.35);
        FX.addShake(e.big ? 14 : 9); FX.addFlash(e.big ? 0.5 : 0.3, '#ffd9a0'); App.hitstop(0.06);
        if (snd) Sound.boom(e.big); if (hap) hap.play(HAPTIC.boom); break;
      case 'frost': FX.burst(e.x, e.y, 10, 120, '#dff6ff', 0, 2, 0.5); if (snd) Sound.frost(); break;
      case 'clone': FX.ring(e.x, e.y, 4, 26, 0.3, '#fff', 2); if (snd) Sound.clone(); break;
      case 'shatter': FX.burst(e.x, e.y, 16, 240, '#b4f3ff', 1, 2, 0.4); if (snd) Sound.shatter(); if (hap) hap.play(HAPTIC.hit); break;
      case 'sprout': FX.burst(e.x, e.y, 12, 140, '#7ae582', 0, 2.2, 0.5); FX.ring(e.x, e.y, 4, 26, 0.35, '#7ae582', 3); if (snd) Sound.sprout(); break;
      case 'gate': if (snd) Sound.gate(); FX.burst(e.x, e.y, 6, 80, '#ffd166', 0, 1.8, 0.3); break;
      case 'echo': FX.ring(e.x, e.y, 4, 30, 0.4, '#c9a7ff', 3); break;
      case 'orbSpawn': FX.ring(e.x, e.y, 40, 10, 0.5, '#ffd166', 4); if (!quiet) FX.banner('GOLDEN ORB!', 'Hit it before it fades', '#ffd166', 1.1, 1); if (snd) Sound.orb(); break;
      case 'orbGone': FX.burst(e.x, e.y, 10, 80, '#ffd166', 0, 1.5, 0.4); break;
      case 'golden': FX.burst(e.x, e.y, 30, 320, '#ffd166', 0, 3, 0.8); FX.ring(e.x, e.y, 10, 90, 0.5, '#fff6c2', 5); FX.addFlash(0.35, '#ffe08a'); App.hitstop(0.07); if (snd) Sound.golden(); if (hap) hap.play(HAPTIC.pickup); break;
      case 'coin': if (snd) Sound.coin(); FX.burst(e.x, e.y, 2, 60, '#ffd166', 0, 1.6, 0.3); break;
      case 'tenth': FX.ring(e.x, e.y, 6, 40, 0.4, '#c9a7ff', 4); if (snd) Sound.tenth(); break;
      case 'chaosUp':
        if (!quiet && e.lvl >= 2) FX.banner(T.CHAOS_LEVELS[e.lvl].name, '×' + T.CHAOS_LEVELS[e.lvl].mult + ' points', CHAOS_COL[e.lvl], 0.9, 1);
        if (snd) Sound.chaosUp(e.lvl); if (hap) hap.play([8]); break;
      case 'cleared':
        if (!quiet) { FX.banner('CLEARED!', run.hand.length ? 'Keep throwing for coins, or cash out' : '', '#8be28b', 1.6, 3); FX.burst(T.W / 2, T.H * 0.38, 40, 340, '#8be28b', 2, 3, 1, 260); }
        if (snd) Sound.clear(); if (hap) hap.play(HAPTIC.clear); break;
      case 'room':
        if (!quiet) {
          if (e.boss) FX.banner('BOSS: ' + BOSSES[e.boss].name, BOSSES[e.boss].desc, '#ff8fa0', 2.2, 2);
          else if (e.mut) FX.banner(MUTATORS[e.mut].name, MUTATORS[e.mut].desc, '#4cc9f0', 2, 2);
          else FX.banner('ROOM ' + e.n, 'Target ' + fmt(e.target), '#fff7e6', 1.3, 2);
        }
        Sound.resetNotes(); break;
      case 'roomEnd': if (!quiet) App.onRoomEnd(); break;
      case 'over': if (!quiet) App.onRunOver(); break;
    }
  }
  ev.length = 0;
}

/* ============================ 9. UI SCREENS ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const UI = {
  scr: $('screen'), modal: $('modal'), cd: $('countdown'), rot: $('rotate'), pauseBtn: $('pauseBtn'), bankBtn: $('bankBtn'), toasts: $('toasts'),
  name: null, back: null, bankHidden: true, bankLabel: '', vis: {},
  setVis(el, on) { const k = el.id; if (this.vis[k] === on) return; this.vis[k] = on; el.classList.toggle('hidden', !on); },
  screenOpen() { return !this.scr.classList.contains('hidden') || !this.modal.classList.contains('hidden'); },
  show(name, html, see) {
    this.name = name; this.scr.className = (see ? 'see ' : '') + 'fadein'; this.scr.innerHTML = html; this.scr.scrollTop = 0;
    this.paintPreviews(this.scr);
    const first = this.scr.querySelector('.btn.primary');
    if (first && !Platform.isTouch) first.focus({ preventScroll: true });
  },
  hide() { this.name = null; this.scr.className = 'hidden'; this.scr.innerHTML = ''; },
  layoutButtons() {
    const left = SAVE.settings.hand === 'left';
    this.pauseBtn.style.left = left ? (L.colX + 8) + 'px' : 'auto';
    this.pauseBtn.style.right = left ? 'auto' : (L.vw - L.colX - L.colW + 8) + 'px';
    this.bankBtn.style.top = (L.trayY + 54) + 'px';
    this.toasts.style.top = (L.ay + 10) + 'px';
  },
  frame() {
    const run = App.run;
    const play = App.state === 'play' && run && run.phase === 'play' && !App.paused && App.countdown <= 0 && !App.cdWaiting;
    this.setVis(this.pauseBtn, play && !this.screenOpen());
    const bank = play && run.canBank();
    this.setVis(this.bankBtn, bank); this.bankHidden = !bank;
    if (bank) {
      const left = Math.max(1, Math.ceil(T.AUTO_BANK - (run.stillTicks * T.STEP - T.STOP_HOLD)));
      const label = 'CASH OUT ▶ +' + (run.hand.length * 3) + '●  (' + left + ')';
      if (label !== this.bankLabel) { this.bankBtn.textContent = label; this.bankLabel = label; }
    }
  },
  paintPreviews(root) {
    root.querySelectorAll('canvas.mprev').forEach(c => {
      const css = c.classList.contains('sm') ? 44 : 64, d = Math.min(3, window.devicePixelRatio || 1);
      c.width = c.height = Math.round(css * d);
      const g = c.getContext('2d'), [mat, engs] = c.dataset.m.split('|'), eng = engs ? engs.split(',') : [];
      g.setTransform(d, 0, 0, d, 0, 0);
      const R = css * 0.4 * (MATS[mat].r / 11 > 1.2 ? 1.12 : 1);
      drawMarble(g, css / 2, css / 2, R, R * d, mat, eng, 0.4);
    });
  },
  toast(html) {
    const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = html; this.toasts.appendChild(d);
    setTimeout(() => d.remove(), 2900);
    while (this.toasts.children.length > 3) this.toasts.firstChild.remove();
  },
  confirm(text, yes, onYes) {
    this.modal.innerHTML = '<div class="box"><p class="txt center" style="font-size:19px;font-weight:800">' + text + '</p><div class="row"><button class="btn" data-act="modalNo">Cancel</button><button class="btn primary" style="font-size:20px;min-height:56px" data-act="modalYes">' + yes + '</button></div></div>';
    this.modal.classList.remove('hidden'); this.onYes = onYes;
  },
  showText(title, text) {
    this.modal.innerHTML = '<div class="box"><h2>' + esc(title) + '</h2><textarea readonly>' + esc(text) + '</textarea><p class="muted center">Select the text and copy it.</p><button class="btn primary" data-act="modalNo">Done</button></div>';
    this.modal.classList.remove('hidden'); this.onYes = null;
    const ta = this.modal.querySelector('textarea'); setTimeout(() => { try { ta.focus(); ta.select(); } catch (e) {} }, 50);
  },
  closeModal() { this.modal.classList.add('hidden'); this.modal.innerHTML = ''; this.onYes = null; },
  showCountdown(waiting) {
    this.cd.classList.remove('hidden');
    this.cd.innerHTML = waiting ? '<div class="t">TAP TO CONTINUE</div>' : '<div class="n">3</div>';
  },
  setCountdown(n) { const el = this.cd.querySelector('.n'); if (el && el.textContent !== String(n)) { el.textContent = n; Sound.tick(); } },
  hideCountdown() { this.cd.classList.add('hidden'); this.cd.innerHTML = ''; },
  focusables() { const root = !this.modal.classList.contains('hidden') ? this.modal : this.scr; return Array.from(root.querySelectorAll('button:not([disabled])')).filter(b => b.dataset.act); },
  moveFocus(dir) {
    const f = this.focusables(); if (!f.length) return;
    let i = f.indexOf(document.activeElement); i = i < 0 ? 0 : (i + dir + f.length) % f.length;
    f[i].focus(); f[i].scrollIntoView({ block: 'nearest' });
  },
  clickFocused() { const f = this.focusables(); const el = f.indexOf(document.activeElement) >= 0 ? document.activeElement : (this.scr.querySelector('.btn.primary') || f[0]); if (el) el.click(); },
  goBack() {
    if (!this.modal.classList.contains('hidden')) { this.closeModal(); return; }
    if (this.back) { const b = this.back; b(); }
  },
};

function tipFor(run) {
  const st = run.stats, tips = [];
  if (st.kicks === 0 && st.throws > 2) tips.push('Tap anywhere while marbles roll to KICK them back up to speed.');
  if (st.collisions > 20 && st.mmHits < st.collisions * 0.12) tips.push('Aim at marbles already on the table: marble-on-marble hits pay double.');
  if (st.bestChaos < 3) tips.push('Fling the next marble before the last one stops. Chaos only grows while things keep crashing.');
  if (st.lost >= 3) tips.push('Holes swallow slow marbles. Fast ones can skim right over the edge (and score a near-miss).');
  if (run.bag.every(m => !m.eng.length)) tips.push('Engrave your marbles. Abilities trigger on every collision.');
  if (run.charms.length === 0 && st.rooms >= 2) tips.push('Charms change the rules for the whole run. Save coins for one in the shop.');
  if (st.maxLeftover === 0 && st.rooms >= 2) tips.push('Clear a room early: every unused marble pays 3 coins and bonus points.');
  tips.push('Gold ×2 gates charge any marble that rolls through them.', 'Bumpers add speed. Bank shots off them keep marbles alive.');
  return tips[0];
}

/* -------------------------- action dispatcher -------------------------- */
function applySettings() {
  const st = SAVE.settings;
  Platform.haptics.set(st.haptics);
  Sound.setSfx(st.sound); Sound.setMusic(st.music);
  setTheme(st.theme);
  document.documentElement.classList.toggle('rm', st.reducedMotion);
}
function handleAct(act, arg) {
  const run = App.run;
  switch (act) {
    case 'play': startRun('endless'); break;
    case 'daily': startRun('daily'); break;
    case 'workshop': showWorkshop(); break;
    case 'records': showRecords('top'); break;
    case 'rtab': showRecords(arg); break;
    case 'settings': showSettings(showTitle); break;
    case 'back': UI.goBack(); break;
    case 'set': SAVE.settings[arg] = !SAVE.settings[arg]; persist(); applySettings(); if (arg === 'lowPower') { Perf.q = SAVE.settings.lowPower ? 0 : 2; computeLayout(); } showSettings(UI.back); break;
    case 'sens': SAVE.settings.sensitivity = +arg; persist(); showSettings(UI.back); break;
    case 'hand': SAVE.settings.hand = arg; persist(); UI.layoutButtons(); showSettings(UI.back); break;
    case 'theme': if (themeOwned(arg)) { SAVE.settings.theme = arg; persist(); applySettings(); } if (UI.name === 'workshop') showWorkshop(); else showSettings(UI.back); break;
    case 'tutorial': SAVE.tutorialDone = false; persist(); UI.toast('Tutorial will show in your next run'); break;
    case 'reset': UI.confirm('Erase all progress, records and unlocks?', 'Erase', () => UI.confirm('Really? This cannot be undone.', 'Erase all', () => { Platform.storage.remove(SAVE_KEY); SAVE = defaultSave(); persist(); applySettings(); computeLayout(); showTitle(); UI.toast('All data reset'); })); break;
    case 'modalYes': { const f = UI.onYes; UI.closeModal(); if (f) f(); break; }
    case 'modalNo': UI.closeModal(); break;
    case 'cycleLoadout': {
      const ids = Object.keys(LOADOUTS).filter(loadoutOwned); const i = ids.indexOf(SAVE.settings.loadout);
      SAVE.settings.loadout = ids[(i + 1) % ids.length]; persist();
      if (ids.length === 1) UI.toast('Unlock more starting bags in the Workshop');
      showTitle(); break;
    }
    case 'toggleSound': { const on = !(SAVE.settings.sound || SAVE.settings.music); SAVE.settings.sound = SAVE.settings.music = on; persist(); applySettings(); Sound.unlock(); showTitle(); break; }
    case 'toggleHard': if (owns('mode_hard')) { SAVE.settings.hard = !SAVE.settings.hard; persist(); } if (UI.name === 'workshop') showWorkshop(); else showTitle(); break;
    case 'unlock': {
      const u = UNLOCKS.find(x => x.id === arg); if (!u || owns(u.id) || SAVE.shards < u.cost) { Sound.deny(); break; }
      SAVE.shards -= u.cost; SAVE.owned[u.id] = true;
      if (u.loadout) SAVE.settings.loadout = u.loadout;
      if (u.theme) { SAVE.settings.theme = u.theme; applySettings(); }
      persist(); Sound.buy(); UI.toast('Unlocked: ' + esc(u.name)); showWorkshop(); break;
    }
    case 'equipBag': if (loadoutOwned(arg)) { SAVE.settings.loadout = arg; persist(); } showWorkshop(); break;
    case 'card': if (App.act({ a: 'card', i: +arg })) { Sound.card(); App.afterChoice(); } break;
    case 'skip': if (App.act({ a: 'skip' })) App.afterChoice(); break;
    case 'target': if (App.act({ a: 'target', i: +arg })) { Sound.buy(); App.afterChoice(); } break;
    case 'cancelPick': if (App.act({ a: 'cancel' })) App.afterChoice(); break;
    case 'buy': if (App.act({ a: 'buy', i: +arg })) { Sound.buy(); App.afterChoice(); } else Sound.deny(); break;
    case 'reroll': if (App.act({ a: 'reroll' })) { Sound.card(); showShop(); } break;
    case 'viewBag': showPick(true, showShop); break;
    case 'leave': if (App.act({ a: 'leave' })) { UI.hide(); App.acc = 0; Platform.wake.request(); } break;
    case 'resume': resumeGame(); break;
    case 'pauseBag': showPick(true, showPause); break;
    case 'pauseSettings': showSettings(showPause); break;
    case 'quit': UI.confirm('Quit this run? It won’t be scored.', 'Quit', () => { App.endRunToMenu(); }); break;
    case 'retry': App.saveInitials(); startRun(run.cfg.mode === 'daily' ? 'daily' : 'endless'); break;
    case 'rematch': App.saveInitials(); startRun('endless', run.cfg.seed); break;
    case 'menu': App.saveInitials(); App.endRunToMenu(); break;
    case 'share': shareRun(); break;
    case 'iniUp': case 'iniDown': {
      const i = +arg, A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let k = A.indexOf(App.ini[i]); k = (k + (act === 'iniUp' ? 1 : -1) + A.length) % A.length;
      App.ini[i] = A[k]; const el = $('ini' + i); if (el) el.textContent = A[k];
      App.saveInitials(); break;
    }
  }
}

/* ============================== 10. INPUT ============================== */
const Input = {
  pid: null, sx: 0, sy: 0, x: 0, y: 0, t0: 0, aiming: false, lx: T.W / 2, ly: T.H * 0.8, buffered: null,
  keyAng: -Math.PI / 2, keyCharging: false, keyPow: 0, keyDir: 1, keyShowT: 0, keys: {}, padPrev: {},
  reset() { this.pid = null; this.aiming = false; this.buffered = null; this.keyCharging = false; this.keyPow = 0; this.keys = {}; },
  aimParams() {
    if (this.keyCharging || (!this.aiming && this.keyShowT > 0)) return { ang: this.keyAng, pow: this.keyCharging ? this.keyPow : 0.5 };
    const dx = this.x - this.sx, dy = this.y - this.sy;
    const ang = Math.atan2(-dy, -dx);                     // fire opposite the pull, in any direction
    const maxPull = Math.max(110, L.vh * [0.24, 0.18, 0.13][SAVE.settings.sensitivity]);
    return { ang, pow: clamp((Math.hypot(dx, dy) - T.CANCEL_R) / maxPull, 0, 1) };  // power starts at the cancel ring
  },
  cancelling() { return this.pid !== null && this.aiming && Math.hypot(this.x - this.sx, this.y - this.sy) < T.CANCEL_R; },
  worldX(cx) { return clamp((cx - L.ax) / L.s, 12, T.W - 12); },
  worldY(cy) { return clamp((cy - L.ay) / L.s, 12, T.H - 12); },
};
function canPlayInput() { return App.state === 'play' && App.run && App.run.phase === 'play' && !App.paused && App.countdown <= 0 && !App.cdWaiting && !UI.screenOpen(); }
canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (!canPlayInput()) return;
  e.preventDefault();
  if (Input.pid !== null) {                            // a second finger cancels the shot in progress
    if (Input.aiming) { Input.pid = null; Input.aiming = false; Sound.deny(); Platform.haptics.play([10]); }
    return;
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  Input.pid = e.pointerId; Input.sx = Input.x = e.clientX; Input.sy = Input.y = e.clientY; Input.t0 = performance.now(); Input.aiming = false;
  Input.lx = Input.worldX(e.clientX); Input.ly = Input.worldY(e.clientY);   // the marble drops where the finger lands
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== Input.pid) return;
  Input.x = e.clientX; Input.y = e.clientY;
  if (!Input.aiming && Math.hypot(Input.x - Input.sx, Input.y - Input.sy) > 10) Input.aiming = true;
});
function endPointer(e, cancel) {
  if (e.pointerId !== Input.pid) return;
  const dt = performance.now() - Input.t0;
  if (!cancel && canPlayInput()) {
    if (Input.aiming) {
      if (Input.cancelling()) { Sound.deny(); Platform.haptics.play([10]); }   // released inside the cancel ring: undo

function keyboardUpdate(dt) {

/* =========================== 11. APP / MAIN LOOP =========================== */
const App = {
  state: 'boot', run: null, ghost: null, ghostVisible: false, attract: null, attractAcc: 0, attractNext: 0, attractEnd: 0,
  paused: false, countdown: 0, cdWaiting: false, acc: 0, last: 0, lastDraw: 0, time: 0,

  slowmo(d) { if (this.state === 'play') this.slowT = Math.max(this.slowT, d); },

  act(a) { const r = this.run; if (!r) return false; const ok = r.act(a); return ok; },

  },
  tryKick() { const run = this.run; if (run && run.canKick()) run.act({ a: 'kick' }); },
  afterChoice() {

  },
  onRoomEnd() {

  },
  checkGoals() {

    for (const c of this.challenges) if (!this.chalDone[c.id] && c.check(run)) {
      this.chalDone[c.id] = true; SAVE.shards += c.reward; SAVE.stats.shardsEarned += c.reward; this.goalShards += c.reward;
      UI.toast('✓ ' + esc(c.text) + ' ' + sh('+' + c.reward));
    }
    for (const a of ACHIEVEMENTS) if (!SAVE.achievements[a.id] && a.check(run, SAVE.stats)) {
      SAVE.achievements[a.id] = todayStr(); SAVE.shards += a.reward; SAVE.stats.shardsEarned += a.reward; this.goalShards += a.reward;

  },
  onRunOver() {
    const run = this.run, s = SAVE.stats, daily = run.cfg.mode === 'daily', assist = !!run.cfg.assist;

  },

};
function pickChallenges(daily) {
  const rng = daily ? RNG(hash32('chal|' + todayStr())) : RNG((Math.random() * 4294967296) >>> 0);
  return rng.shuffle(CHALLENGES.slice()).slice(0, 3);
}
function startRun(mode, seed) {
  Sound.unlock();
  const daily = mode === 'daily', st = SAVE.settings;
  const cfg = daily
    ? { v: GAME_VERSION, mode: 'daily', seed: hash32('CLACK-DAILY-' + todayStr()), loadout: 'classic', pool: ALL_POOL, hard: false, assist: st.assist, perks: [], coins: 0 }
    : { v: GAME_VERSION, mode: 'endless', seed: seed != null ? seed >>> 0 : (Math.random() * 4294967296) >>> 0, loadout: loadoutOwned(st.loadout) ? st.loadout : 'classic', pool: currentPool(), hard: st.hard && owns('mode_hard'), assist: st.assist, perks: ownedPerks(), coins: owns('perk_coins') ? 5 : 0 };
  FX.reset(); Input.reset(); Input.lx = T.W / 2; Input.ly = T.H * 0.8;
  App.run = new Run(cfg, true);
  const rec = daily ? (SAVE.daily.date === todayStr() ? SAVE.daily.record : null) : SAVE.ghost;
  App.ghost = rec && rec.cfg && rec.v === GAME_VERSION ? new Ghost(rec) : null;

  UI.hide(); UI.closeModal(); UI.hideCountdown();
  Sound.Music.setMode('play'); Platform.wake.request();

  UI.toast('Challenges: ' + App.challenges.map(c => esc(c.text)).join(' · '));
}
function gameTick() {
  const run = App.run;

    if (run.canFling()) { run.act(App.bufferedFling.act); App.bufferedFling = null; }
    else if (App.time > App.bufferedFling.until || !run.hand.length) App.bufferedFling = null;
  }
  const wasPlay = run.phase === 'play';

function pauseGame() {

  Platform.wake.release(); persist(); showPause();
}
function resumeGame() { UI.hide(); App.cdWaiting = false; startCountdown(); }
function startCountdown() { App.cdWaiting = false; App.countdown = 1.8; UI.showCountdown(false); Sound.resume(); Sound.unlock(); Platform.wake.request(); }
function countdownUpdate(dt) {

  App.countdown -= dt;
  if (App.countdown <= 0) { App.countdown = 0; App.paused = false; UI.hideCountdown(); return; }
  UI.setCountdown(Math.ceil(App.countdown / 0.6));
}
function newAttract() {
  const r = new Run({ v: GAME_VERSION, mode: 'attract', seed: (Math.random() * 4294967296) >>> 0, loadout: 'chaos', pool: ALL_POOL, hard: false, assist: false, perks: [], coins: 0 }, true);
  r.bag.push(r.newMarble('glass', ['spark'], 1), r.newMarble('steel', ['bomb'], 1), r.newMarble('rubber', ['crown'], 1));
  r.startRoom(1 + Math.floor(Math.random() * 6));
  if (r.mut === 'blackout') r.mut = null;
  r.events.length = 0;
  App.attract = r; App.attractNext = 0.6; App.attractEnd = 0;
}
function attractUpdate(dt) {
  const r = App.attract; if (!r) return;
  App.attractAcc += dt; let n = 0;
  while (App.attractAcc >= T.STEP && n < T.MAX_STEPS) { r.step(); App.attractAcc -= T.STEP; n++; }

function onResize() {
  computeLayout();
  const landscapePhone = L.vw > L.vh && Platform.isTouch && L.vh < 520;
  UI.rot.classList.toggle('hidden', !landscapePhone);
  if (landscapePhone) pauseGame();
}
function frame(now) {
  requestAnimationFrame(frame);
  if (SAVE.settings.lowPower && now - App.lastDraw < 1000 / 30 - 2) return;   // 30 fps cap
  let dt = (now - App.last) / 1000; App.last = now; App.lastDraw = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  App.time += dt;
  if (document.visibilityState === 'visible') Perf.sample(dt);
  pollGamepad(dt); keyboardUpdate(dt);
  let ts = 1;
  if (App.stopT > 0) { App.stopT -= dt; ts = 0.05; } else if (App.slowT > 0) { App.slowT -= dt; ts = 0.35; }

      if (n >= T.MAX_STEPS) App.acc = 0;

  UI.frame();
  FX.update(dt * (App.stopT > 0 ? 0.25 : ts < 1 ? 0.6 : 1));
  const alpha = App.state === 'title' ? clamp(App.attractAcc / T.STEP, 0, 1) : clamp(App.acc / T.STEP, 0, 1);
  render(alpha, App.time, dt);
}

/* ------------------------- PWA: inline manifest + icons ------------------------- */
function makeIcon(size) {

  g.fillStyle = '#0b1f18'; g.fillRect(0, 0, size, size);

  drawMarble(g, size * 0.38, size * 0.55, R, R, 'clay', [], 0.6);
  drawMarble(g, size * 0.64, size * 0.42, R * 0.9, R * 0.9, 'glass', ['spark'], 0);
  g.strokeStyle = '#ffd166'; g.lineWidth = size * 0.025; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) { const a = -2.2 + i * 0.5, r0 = R * 1.25, r1 = R * 1.7; g.beginPath(); g.moveTo(size * 0.51 + Math.cos(a) * r0 * 0.4, size * 0.485 + Math.sin(a) * r0 * 0.4 - R * 0.6); g.lineTo(size * 0.51 + Math.cos(a) * r1 * 0.5, size * 0.485 + Math.sin(a) * r1 * 0.5 - R * 0.6); g.stroke(); }
  return c.toDataURL('image/png');
}
function setupPWA() {
  try {
    const i192 = makeIcon(192), i512 = makeIcon(512);
    const manifest = { name: 'CLACK: Marble Chaos', short_name: 'CLACK', description: 'One-thumb marble chaos roguelite.', start_url: location.href.split('#')[0], display: 'standalone', orientation: 'portrait', background_color: '#0b1f18', theme_color: '#0b1f18', icons: [{ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    const link = document.createElement('link'); link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
    const apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = makeIcon(180); document.head.appendChild(apple);
    const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = makeIcon(64); document.head.appendChild(fav);

}

/* ------------------------------- lifecycle ------------------------------- */

  if (document.hidden) { pauseGame(); persist(); Sound.suspend(); Platform.wake.release(); }
  else if (!(App.state === 'play' && App.paused)) Sound.resume();

window.addEventListener('blur', () => pauseGame());

function boot() {
  FX.init();
  applySettings();
  computeLayout();
  onResize();
  setupPWA();

  requestAnimationFrame(t => { App.last = t; App.lastDraw = t; requestAnimationFrame(frame); });
}
// Debug / QA hooks (also handy for a native wrapper or server-side verifier).

boot();
